<title>語学ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f7f6f4; --card:#fff; --sunk:#eeece8;
  --ink:#1d1b19; --ink-2:#565049; --ink-3:#8a837a;
  --line:#e2ded7; --line-2:#cdc7bd;
  --good:#1d7a4c; --good-soft:#e3f2e8;
  --bad:#b3341f; --bad-soft:#fbe7e2;
  --mark:#d9a520; --mark-soft:#fdf0c9; --mark-ink:#7a5a00;
  --f1:#2f6f9f; --f2:#8a4f9e; --f3:#0f7a6b; --f4:#b2632a; --f5:#4a6a2e; --f6:#a1444f;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(30,25,20,.06), 0 4px 14px rgba(30,25,20,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15140f; --card:#1e1c18; --sunk:#262320;
  --ink:#eeebe5; --ink-2:#b4aca0; --ink-3:#847c72;
  --line:#312d28; --line-2:#433d36;
  --good:#54c084; --good-soft:#15301f;
  --bad:#f0806a; --bad-soft:#341a14;
  --mark:#c9a33a; --mark-soft:#40350f; --mark-ink:#e8cd7a;
  --f1:#6ba8d6; --f2:#c08ed4; --f3:#4fc2b0; --f4:#e0965a; --f5:#8fbf5e; --f6:#e08a95;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --paper:#15140f; --card:#1e1c18; --sunk:#262320;
  --ink:#eeebe5; --ink-2:#b4aca0; --ink-3:#847c72;
  --line:#312d28; --line-2:#433d36;
  --good:#54c084; --good-soft:#15301f;
  --bad:#f0806a; --bad-soft:#341a14;
  --mark:#c9a33a; --mark-soft:#40350f; --mark-ink:#e8cd7a;
  --f1:#6ba8d6; --f2:#c08ed4; --f3:#4fc2b0; --f4:#e0965a; --f5:#8fbf5e; --f6:#e08a95;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
/* 言語ごとのアクセント色（インドネシア語＝青緑／中国語＝朱） */
:root[data-lang="id"]{ --accent:#0e6e7d; --accent-soft:#e1eff1; --accent-ink:#0a5561 }
:root[data-lang="zh"]{ --accent:#a32b35; --accent-soft:#f8e7e8; --accent-ink:#8a1f28 }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"])[data-lang="id"]{ --accent:#56c0d2; --accent-soft:#12343b; --accent-ink:#85d6e4 }
  :root:not([data-theme="light"])[data-lang="zh"]{ --accent:#e0737c; --accent-soft:#3a1418; --accent-ink:#f0a3a9 }
}
:root[data-theme="dark"][data-lang="id"]{ --accent:#56c0d2; --accent-soft:#12343b; --accent-ink:#85d6e4 }
:root[data-theme="dark"][data-lang="zh"]{ --accent:#e0737c; --accent-soft:#3a1418; --accent-ink:#f0a3a9 }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
  font-size:15px; line-height:1.75; -webkit-text-size-adjust:100%}
h1,h2,h3,.disp{font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif; text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer}
.tgt{font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif; letter-spacing:.02em}

#top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line)}
#top .bar{max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
#top .mark{width:26px; height:26px; border-radius:7px; background:var(--accent); color:#fff;
  display:grid; place-items:center; font-size:11px; font-weight:700; flex:none}
#top h1{margin:0; font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.langsw{display:flex; flex:none; border:1px solid var(--line-2); border-radius:8px; overflow:hidden; background:var(--card)}
.langsw button{border:0; background:none; color:var(--ink-3); font-size:11.5px; font-weight:700;
  padding:0 10px; height:30px; line-height:1; letter-spacing:.03em}
.langsw button[aria-pressed="true"]{background:var(--accent); color:#fff}
@media (max-width:420px){ #top .bar{gap:7px; padding:10px 12px} .savedot .txt{display:none} .savedot{padding:5px} }
#top .spacer{flex:1}
.iconbtn{background:none; border:1px solid var(--line-2); border-radius:8px;
  width:32px; height:32px; display:grid; place-items:center; font-size:14px; flex:none}
.savedot{display:inline-flex; align-items:center; gap:5px; flex:none; font-size:10.5px; font-weight:700;
  color:var(--ink-3); padding:3px 8px 3px 6px; border-radius:99px; background:var(--sunk)}
.savedot i{width:6px; height:6px; border-radius:50%; background:var(--good); flex:none}
.savedot.saving i{background:var(--mark); animation:pulse 1s ease-in-out infinite}
.savedot.saving{color:var(--mark-ink)}
@media (max-width:359px){ .savedot .txt{display:none} }
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
main{max-width:720px; margin:0 auto; padding:16px 16px 104px}
.view[hidden]{display:none!important}
#nav{position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter:saturate(1.4) blur(10px); border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#nav .row{max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:3px}
#nav button{background:none; border:0; border-radius:10px; padding:7px 2px 5px;
  display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; color:var(--ink-3)}
#nav button .ic{font-size:17px; line-height:1}
#nav button[aria-current="true"]{color:var(--accent-ink); background:var(--accent-soft)}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.eyebrow{font-size:11px; letter-spacing:.09em; color:var(--ink-3); font-weight:700; margin:0 0 6px}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px; line-height:1.6}
.btn{border:1px solid var(--line-2); background:var(--card); border-radius:10px;
  padding:11px 14px; font-weight:700; font-size:14px; width:100%; text-align:center}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.btnrow{display:flex; gap:8px}
.btnrow .btn{flex:1}
.seg{display:flex; background:var(--sunk); border-radius:10px; padding:3px; margin:0 0 14px}
.seg button{flex:1; border:0; background:none; border-radius:8px; padding:8px 4px; font-size:13px; font-weight:700; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
  padding:2px 7px; border-radius:99px; white-space:nowrap}
.chip.f{color:#fff}
.chip.tag{background:var(--sunk); color:var(--ink-2)}
.chip.hot{background:var(--bad-soft); color:var(--bad)}
.bar{height:6px; border-radius:99px; background:var(--sunk); overflow:hidden}
.bar i{display:block; height:100%; border-radius:99px; background:var(--accent)}
.metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border-radius:var(--r-s); overflow:hidden; margin-top:14px}
.metrics div{background:var(--card); padding:10px 8px; text-align:center}
.metrics b{display:block; font-size:19px; font-weight:600}
.metrics small{display:block; font-size:10.5px; color:var(--ink-3); margin-top:1px}
.todo{display:flex; align-items:center; gap:11px; padding:12px 0; border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo .t{flex:1; min-width:0}
.todo .t b{display:block; font-size:14px; font-weight:700}
.todo .t small{display:block; font-size:12px; color:var(--ink-2); margin-top:1px}
.todo .go{border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-ink);
  border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:700; flex:none}
.rowbtn{width:100%; display:flex; align-items:center; gap:11px; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-s); padding:12px 13px; margin-top:8px}
.rowbtn .lead{width:5px; align-self:stretch; border-radius:99px; flex:none}
.rowbtn .body{flex:1; min-width:0}
.rowbtn .body b{display:block; font-size:14px; font-weight:700}
.rowbtn .body small{display:block; font-size:11.5px; color:var(--ink-3); margin-top:2px}
.rowbtn .end{flex:none; font-size:12px; color:var(--ink-3); text-align:right}
.rowbtn .end .pct{font-weight:700; font-size:14px; color:var(--ink)}
.done{color:var(--good)}
.empty{text-align:center; color:var(--ink-3); padding:28px 12px; font-size:13.5px}

/* 音声 */
.say{border:1px solid var(--accent); background:var(--accent-soft); border-radius:99px;
  width:34px; height:34px; padding:0; font-size:15px; display:inline-grid; place-items:center;
  flex:none; line-height:1; vertical-align:middle; transition:box-shadow .15s, background .15s}
.say[disabled]{opacity:.4}
.say.playing{background:var(--accent); box-shadow:0 0 0 4px var(--accent-soft)}
@media (prefers-reduced-motion:no-preference){ .say.playing{animation:pulse .9s ease infinite} }
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* 教科書 */
.doc{font-size:15px; line-height:1.88; --fc:var(--accent)}
.doc h3{font-size:19px; margin:4px 0 18px; font-weight:700; padding-left:12px; border-left:4px solid var(--fc); line-height:1.5}
.doc p{margin:0 0 17px}
.doc p.lead{font-size:15px; margin:0 0 20px; padding:13px 15px; border-radius:10px;
  background:var(--sunk); background:color-mix(in srgb, var(--fc) 8%, var(--sunk)); border-left:3px solid var(--fc)}
.doc ul{margin:0 0 20px; padding:0; list-style:none}
.doc li{position:relative; padding-left:17px; margin:0 0 12px}
.doc li::before{content:""; position:absolute; left:2px; top:.78em; width:6px; height:6px; border-radius:50%; background:var(--fc); opacity:.7}
.doc li > b:first-child{color:var(--fc)}
.doc u{text-decoration:none; padding:0 2px; border-radius:2px;
  background:linear-gradient(transparent 58%, color-mix(in srgb, var(--fc) 24%, transparent) 0)}
.doc b{font-weight:700}
.doc i{font-style:normal; font-weight:600}
.tablewrap{overflow-x:auto; margin:0 0 20px; border:1px solid var(--line); border-radius:var(--r-s)}
.doc table{border-collapse:collapse; width:100%; font-size:12.5px; line-height:1.7}
.doc th,.doc td{border-bottom:1px solid var(--line); padding:10px 12px; text-align:left; vertical-align:top; word-break:break-word}
.doc th{background:var(--sunk); background:color-mix(in srgb, var(--fc) 11%, var(--sunk));
  color:var(--fc); font-weight:700; font-size:11.5px}
.doc tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--fc) 4%, transparent)}
.doc tr:last-child td{border-bottom:0}
.doc td .say{width:26px; height:26px; font-size:12px; margin-left:5px}
.box{border-radius:var(--r-s); padding:14px 16px; margin:0 0 20px; font-size:14px; line-height:1.82}
.box .lab{font-size:10.5px; font-weight:700; letter-spacing:.09em; display:block; margin-bottom:7px}
.box.ex{background:var(--sunk); border-left:3px solid var(--ink-3)}
.box.ex .lab{color:var(--ink-3)}
.box.ex .q{font-weight:700; margin-bottom:9px; padding-bottom:9px; border-bottom:1px dashed var(--line-2)}
.box.key{background:var(--accent-soft); border-left:3px solid var(--accent)}
.box.key .lab{color:var(--accent-ink)}
.box.key ul{margin:0; padding:0; list-style:none}
.box.key li{margin:0 0 7px; padding-left:15px; position:relative}
.box.key li::before{content:""; position:absolute; left:1px; top:.8em; width:5px; height:5px; border-radius:1px; background:var(--accent); opacity:.8}
.box.warn{background:var(--mark-soft); border-left:3px solid var(--mark)}
.box.warn .lab{color:var(--mark-ink)}
figure.fig{margin:0 0 22px; background:var(--sunk); border-radius:var(--r-s); padding:14px 12px 11px; overflow-x:auto}
figure.fig svg{display:block; width:100%; max-width:100%; height:auto; color:var(--ink)}
figure.fig figcaption{margin-top:9px; font-size:12px; line-height:1.6; color:var(--ink-2)}
figure.fig .fc-s{stroke:var(--fc)} figure.fig .fc-f{fill:var(--fc)}
figure.fig .ac-s{stroke:var(--accent)} figure.fig .ac-f{fill:var(--accent)}
figure.fig .ng-s{stroke:var(--bad)} figure.fig .ng-f{fill:var(--bad)}
figure.fig .mk-f{fill:var(--mark)}
.cmp{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 22px}
@media (max-width:420px){ .cmp{grid-template-columns:1fr} }
.cmp .side{border:1px solid var(--line); border-radius:var(--r-s); padding:11px 12px; background:var(--card)}
.cmp .side h4{margin:0 0 7px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px}
.cmp .side h4 .dot{width:8px; height:8px; border-radius:50%; flex:none}
.cmp .side ul{margin:0; padding:0; list-style:none}
.cmp .side li{font-size:13px; line-height:1.65; margin:0 0 5px; padding-left:0}
.cmp .side li::before{display:none}
.cmp .a h4 .dot{background:var(--bad)}
.cmp .b h4 .dot{background:var(--good)}
.tools{display:flex; gap:7px; margin:0 0 12px; flex-wrap:wrap}
.tools button{border:1px solid var(--line-2); background:var(--card); border-radius:99px;
  padding:7px 13px; font-size:12.5px; font-weight:700; color:var(--ink-2)}
.tools button.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink)}
.mkhint{background:var(--sunk); color:var(--ink-2); border-radius:var(--r-s); padding:9px 12px; font-size:12px; line-height:1.6; margin:0 0 12px}
mark.hl{background:linear-gradient(transparent 8%, var(--mark-soft) 8%, var(--mark-soft) 92%, transparent 92%);
  color:inherit; border-radius:2px; padding:0 1px; box-shadow:inset 0 -2px 0 color-mix(in srgb, var(--mark) 55%, transparent)}
#selbar{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(80px + env(safe-area-inset-bottom,0px)); z-index:40;
  background:var(--card); border:1px solid var(--line-2); border-radius:99px;
  box-shadow:0 4px 18px rgba(20,20,20,.18); padding:5px; display:flex; gap:4px}
#selbar[hidden]{display:none!important}
#selbar button{border:0; background:none; border-radius:99px; padding:8px 15px; font-size:13px; font-weight:700; white-space:nowrap}
#selbar .mkadd{background:var(--mark-soft); color:var(--mark-ink)}
.bmrow{display:flex; align-items:center; gap:9px; padding:10px 0; border-top:1px solid var(--line)}
.bmrow:first-child{border-top:0}
.bmrow .nm{flex:1; min-width:0; text-align:left; background:none; border:0; padding:0}
.bmrow .nm b{display:block; font-size:14px; font-weight:700}
.bmrow .nm small{display:block; font-size:11.5px; color:var(--ink-3)}
.bmrow .del{background:none; border:0; color:var(--ink-3); font-size:15px; padding:2px 6px; flex:none}
.hlitem{border-top:1px solid var(--line); padding:11px 0}
.hlitem:first-child{border-top:0}
.hlitem .src{font-size:11px; color:var(--ink-3); font-weight:700; margin-bottom:4px; display:flex; gap:6px; align-items:center}
.hlitem .tx{font-size:13.5px; line-height:1.7}

/* 練習 */
.qhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.qhead .prog{flex:1}
.qhead .cnt{font-size:12px; color:var(--ink-2); flex:none}
.qtop{display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap}
.qtext{font-size:17px; line-height:1.8; font-weight:500; margin:8px 0 16px}
.opt{width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line-2);
  border-radius:11px; padding:13px 14px; margin-top:9px; font-size:15px; line-height:1.6;
  display:flex; gap:10px; align-items:flex-start}
.opt .mk{flex:none; width:23px; height:23px; border-radius:50%; border:1.5px solid var(--line-2);
  display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--ink-2); margin-top:1px}
.opt.ok{border-color:var(--good); background:var(--good-soft)}
.opt.ok .mk{border-color:var(--good); background:var(--good); color:#fff}
.opt.ng{border-color:var(--bad); background:var(--bad-soft)}
.opt.ng .mk{border-color:var(--bad); background:var(--bad); color:#fff}
.verdict{margin-top:16px; border-radius:var(--r-s); padding:13px 14px; font-size:14px; line-height:1.8}
.verdict.ok{background:var(--good-soft); border-left:3px solid var(--good)}
.verdict.ng{background:var(--bad-soft); border-left:3px solid var(--bad)}
.verdict .v{font-weight:700; margin-bottom:5px; display:flex; align-items:center; gap:6px}
.verdict.ok .v{color:var(--good)} .verdict.ng .v{color:var(--bad)}
.verdict .lnk{margin-top:9px}
.verdict .lnk button{background:none; border:0; padding:0; font-size:12.5px; font-weight:700; color:var(--accent-ink); text-decoration:underline}
.sticky-act{position:sticky; bottom:calc(76px + env(safe-area-inset-bottom,0px)); margin-top:16px}
/* 並べ替え */
.slot{min-height:56px; border:1.5px dashed var(--line-2); border-radius:11px; padding:10px;
  display:flex; flex-wrap:wrap; gap:7px; align-content:flex-start; background:var(--sunk); margin-bottom:12px}
.slot:empty::after{content:"ここに並べます"; color:var(--ink-3); font-size:12.5px}
.pool{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:6px}
.tok{border:1.5px solid var(--line-2); background:var(--card); border-radius:9px;
  padding:9px 13px; font-size:16px; font-weight:600; line-height:1.4}
.slot .tok{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink)}
.tok.ok{border-color:var(--good); background:var(--good-soft); color:var(--ink)}
.tok.ng{border-color:var(--bad); background:var(--bad-soft); color:var(--ink)}
.score{text-align:center; padding:8px 0 4px}
.score b{display:block; font-size:52px; font-weight:600; line-height:1}
.score .of{font-size:14px; color:var(--ink-2); margin-top:6px}

/* 記録 */
.fchips{display:flex; gap:6px; overflow-x:auto; padding:0 0 3px; margin:0 0 12px}
.fchips button{flex:none; border:1px solid var(--line-2); background:var(--card); border-radius:99px;
  padding:6px 12px; font-size:12px; font-weight:700; color:var(--ink-2); white-space:nowrap}
.fchips button[aria-pressed="true"]{background:var(--cc,var(--accent)); border-color:var(--cc,var(--accent)); color:#fff}
.chartwrap{position:relative; margin:0 0 4px}
.chartwrap svg{display:block; width:100%; height:auto; overflow:visible}
.chartwrap .grid{stroke:var(--line); stroke-width:1}
.chartwrap .ln{fill:none; stroke:var(--cc,var(--accent)); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.chartwrap .pt{fill:var(--card); stroke:var(--cc,var(--accent)); stroke-width:2}
.chartwrap .pt.last{fill:var(--cc,var(--accent))}
.chartwrap .raw{fill:var(--cc,var(--accent)); opacity:.3}
.chartwrap .hit{fill:transparent; cursor:pointer}
.chartwrap text{fill:var(--ink-3); font-size:9px}
.chartwrap text.val{fill:var(--ink); font-size:10px; font-weight:700}
.tip{position:absolute; transform:translate(-50%,-115%); pointer-events:none; background:var(--ink); color:var(--paper);
  border-radius:7px; padding:5px 9px; font-size:11px; line-height:1.45; white-space:nowrap; z-index:5; font-weight:700}
.tip small{display:block; font-weight:400; opacity:.8; font-size:10px}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{display:inline-block; flex:none}
.legend .k-ln{width:16px; height:2px; background:var(--cc,var(--accent)); border-radius:2px}
.legend .k-raw{width:7px; height:7px; border-radius:50%; background:var(--cc,var(--accent)); opacity:.3}

 {t:'fig', cap:'語根 ajar（教え）から、接辞を変えるだけで動詞・名詞・場所名が作られます。語根に気づけば意味が推測できます。', svg:'<svg viewBox="0 0 520 240" role="img" aria-label="語根ajarから接辞によってbelajar、mengajar、pelajar、pengajar、pelajaran、pembelajaranが派生することを示す図"><defs><marker id="ida2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs><g fill="currentColor" font-size="11" text-anchor="middle"><rect x="196" y="100" width="128" height="40" rx="10" class="fc-f" opacity="0.32"/><text x="260" y="118" font-size="14" font-weight="700">ajar</text><text x="260" y="133" font-size="9.5">語根：教え</text><g><rect x="14" y="20" width="150" height="34" rx="7" class="ac-f" opacity="0.2"/><text x="89" y="35" font-weight="700">belajar</text><text x="89" y="48" font-size="9.5">学ぶ（ber-）</text><line x1="166" y1="40" x2="200" y2="104" stroke="currentColor" stroke-width="1.1" marker-end="url(#ida2)" opacity="0.6"/></g><g><rect x="356" y="20" width="150" height="34" rx="7" class="ac-f" opacity="0.2"/><text x="431" y="35" font-weight="700">mengajar</text><text x="431" y="48" font-size="9.5">教える（me-）</text><line x1="354" y1="40" x2="320" y2="104" stroke="currentColor" stroke-width="1.1" marker-end="url(#ida2)" opacity="0.6"/></g><g><rect x="14" y="186" width="150" height="34" rx="7" fill="currentColor" opacity="0.13"/><text x="89" y="201" font-weight="700">pelajar</text><text x="89" y="214" font-size="9.5">生徒（pe-）</text><line x1="166" y1="200" x2="200" y2="138" stroke="currentColor" stroke-width="1.1" marker-end="url(#ida2)" opacity="0.6"/></g><g><rect x="356" y="186" width="150" height="34" rx="7" fill="currentColor" opacity="0.13"/><text x="431" y="201" font-weight="700">pengajar</text><text x="431" y="214" font-size="9.5">教える人（peng-）</text><line x1="354" y1="200" x2="320" y2="138" stroke="currentColor" stroke-width="1.1" marker-end="url(#ida2)" opacity="0.6"/></g><g><rect x="185" y="186" width="150" height="34" rx="7" fill="currentColor" opacity="0.13"/><text x="260" y="201" font-weight="700">pelajaran</text><text x="260" y="214" font-size="9.5">授業・教科（-an）</text><line x1="260" y1="184" x2="260" y2="146" stroke="currentColor" stroke-width="1.1" marker-end="url(#ida2)" opacity="0.6"/></g></g></svg>'},
 {t:'ul',x:[
  '<b>ber-</b>＝自動詞（自分がする・持つ・身につける）',
  '<b>me-</b>＝他動詞（目的語に働きかける）',
  '<b>-kan / -i</b>＝他動詞化・使役化（目的語のとり方が変わる）',
  '<b>di-</b>＝受動態',
  '<b>pe- / -an / ke--an</b>＝名詞化',
  '辞書を引くときは<b>接辞を外して語根で引きます</b>。mengajar なら ajar、belajar も ajar。'
 ]},
 {t:'key',x:['語根＋接辞で意味が変わる','辞書は語根で引く','ber-＝自動詞、me-＝他動詞']}
]},
{id:'f5-02', title:'ber- 動詞', tags:['頻出'], blocks:[
 {t:'p',x:'<b>ber-</b> は「自分が〜する／〜を持っている／〜を身につけている」という<b>自動詞</b>を作ります。目的語をとりません。'},
 {t:'ul',x:[
  '<b>bekerja</b>（働く）← kerja（仕事）※ <u>r で始まる語根では ber- → be-</u>',
  '<b>belajar</b>（学ぶ）← ajar（教え）※ 例外的に be-',
  '<b>berbicara</b>（話す）← bicara（話）',
  '<b>berjalan</b>（歩く）← jalan（道）',
  '<b>berangkat</b>（出発する）← angkat（持ち上げる）',
  '<b>bertemu</b>（会う）← temu（出会い）',
  '<b>berapa</b>ではなく<b>ber＋名詞</b>で「〜を持つ」：<b>beristri</b>（妻がいる）、<b>beruang</b>（お金を持つ）',
  '<u>音の変化</u>：語根が r で始まる／第1音節に er があるとき ber-→be-。<b>berkerja</b> ではなく <b>bekerja</b>。'
 ]},
 {t:'ex',q:'「私はジャカルタで働いています」を作ってください。',a:'<b>Saya bekerja di Jakarta.</b> kerja（仕事）に ber- がついて bekerja（働く）。r で始まるので ber- ではなく be- になります。'},
 {t:'key',x:['ber-＝自動詞（目的語をとらない）','r で始まる語根は be- に変わる','bekerja, belajar, berbicara, berjalan']}
]},
{id:'f5-03', title:'me- 動詞と音の変化', tags:['最重要'], blocks:[
 {t:'p',x:'<b>me-</b> は目的語をとる<b>他動詞</b>を作ります。<u>語根の最初の音によって形が変わる</u>のが最初の壁ですが、規則は6つだけです。'},
 {t:'table',head:['語根の頭文字','me- の形','例','意味'],rows:[
  ['b, f, p*, v','mem-','<b>mem</b>baca ← baca','読む'],
  ['c, d, j, s*, t*, z','men-','<b>men</b>ulis ← tulis','書く'],
  ['g, h, k*, 母音','meng-','<b>meng</b>ambil ← ambil','取る'],
  ['l, m, n, r, w, y','me-','<b>me</b>lihat ← lihat','見る'],
  ['s*','meny-','<b>meny</b>ewa ← sewa','借りる'],
  ['1音節の語根','menge-','<b>menge</b>bom ← bom','爆撃する']
 ]},
 {t:'warn',x:'<b>*印の p, t, k, s は消えます</b>（同化）。pakai→<b>me</b>makai（使う）、tulis→<b>men</b>ulis（書く）、kirim→<b>meng</b>irim（送る）、sewa→<b>meny</b>ewa（借りる）。これが最もつまずくところです。'},
 {t:'ul',x:[
  '<b>membaca</b>（読む）← baca　／　<b>membeli</b>（買う）← beli',
  '<b>menulis</b>（書く）← tulis　／　<b>mendengar</b>（聞く）← dengar',
  '<b>mengambil</b>（取る）← ambil　／　<b>mengirim</b>（送る）← kirim',
  '<b>melihat</b>（見る）← lihat　／　<b>membawa</b>（持っていく）← bawa',
  '会話では接頭辞を落として<b>語根のまま</b>言うことも多い：「Saya beli buku.」でも通じます。'
 ]},
 {t:'ex',q:'語根 tulis（書く）に me- をつけるとどうなりますか。',a:'<b>menulis</b>。t は men- の仲間で、<u>t が消えます</u>。「mentulis」ではありません。p→mem-（消える）、k→meng-（消える）、s→meny-（消える）も同じパターンです。'},
 {t:'key',x:['b,f,p,v→mem-／c,d,j,t,z→men-／g,h,k,母音→meng-','p, t, k, s は消える','会話では語根だけでも通じる']}
]},
{id:'f5-04', title:'-kan と -i', tags:[], blocks:[
 {t:'p',x:'接尾辞 <b>-kan</b> と <b>-i</b> は、動詞の<b>目的語のとり方</b>を変えます。3級レベルなら「こういう働きがある」と分かれば十分です。'},
 {t:'ul',x:[
  '<b>-kan</b>：①〜のためにしてやる ②〜させる（使役）',
  '　<b>membelikan</b>＝（人のために）買ってあげる ← membeli（買う）',
  '　<b>membersihkan</b>＝きれいにする ← bersih（きれいな）',
  '　<b>menjelaskan</b>＝説明する ← jelas（明らかな）',
  '<b>-i</b>：①場所・対象に繰り返し働きかける ②〜に対して',
  '　<b>menanami</b>＝（場所に）植える ← tanam（植える）',
  '　<b>menyukai</b>＝〜を好む ← suka（好き）',
  '<b>Saya membeli buku.</b>（本を買う）と <b>Saya membelikan adik buku.</b>（弟に本を買ってあげる）の違いを見てください。-kan がつくと<u>受け取る人</u>を目的語にできます。'
 ]},
 {t:'ex',q:'bersih（きれいな）を「掃除する（きれいにする）」という動詞にするには？',a:'<b>membersihkan</b>。形容詞に me-...-kan をつけて「〜の状態にする」という他動詞になります。この作り方は非常によく使われます。'},
 {t:'key',x:['-kan＝〜してあげる／〜させる','-i＝〜に対して繰り返し働きかける','形容詞＋me-...-kan＝〜の状態にする']}
]}
]};

 {t:'p',x:'インドネシア語は<b>受動態をよく使います</b>。日本語で能動的に言う場面でも受動で表現することが多いので、読解で必須です。'},
 {t:'ul',x:[
  '作り方：<b>me- を di- に置き換える</b>。membaca（読む）→ <b>dibaca</b>（読まれる）。',

  '<b>Buku itu dibaca oleh saya.</b>＝その本は私によって読まれた。',
  '<u>行為者が「私・あなた」など人称代名詞のときは特別な形</u>：<b>Buku itu saya baca.</b>（di- を使わず「代名詞＋語根」）。これが自然な言い方です。',
  '掲示や案内でよく見ます：<b>Dilarang merokok.</b>＝禁煙（喫煙は禁じられている）、<b>Dijual</b>＝売り出し中。'
 ]},

 {t:'key',x:['me- → di- で受動','oleh＝〜によって','代名詞が行為者なら「代名詞＋語根」','Dilarang 〜＝〜禁止']}
]},
{id:'f6-02', title:'名詞を作る接辞', tags:[], blocks:[
 {t:'ul',x:[
  '<b>pe-（peng-, pem-, pen-, peny-）＋語根</b>＝<u>〜する人・道具</u>。me- と同じ音変化をします。',
  '　<b>pembaca</b>（読者）← baca　／　<b>penulis</b>（作家）← tulis　／　<b>pekerja</b>（労働者）← kerja',
  '<b>語根＋-an</b>＝<u>〜したもの・結果</u>。',

 ]},
 {t:'ex',q:'makan（食べる）から「食べ物」を作ってください。',a:'<b>makanan</b>（-an をつける）。同じく minum（飲む）→ minuman（飲み物）。メニューでよく見る形です。'},
 {t:'key',x:['pe-＝人・道具','-an＝もの・結果','ke--an＝抽象名詞（〜さ）']}

{id:'g113',f:'f2',t:'f2-01',type:'order',q:'インドネシア語（言語＋インドネシア）',w:['bahasa','Indonesia'],e:'bahasa（言語）＋Indonesia。同じく orang Jepang（日本人）、makanan Jepang（日本料理）。',say:'bahasa Indonesia'},
{id:'g114',f:'f2',t:'f2-02',type:'mc',q:'聞き手を含む「私たち」はどれですか。',c:['kita','kami','kalian'],a:0,e:'kita＝聞き手を含む私たち、kami＝聞き手を含まない私たち。kalian は「あなたたち」。この区別はインドネシア語の特徴です。'},
{id:'g115',f:'f2',t:'f2-02',type:'mc',q:'初対面の目上の人に対して「あなた」と言うとき、最も無難なのは？',c:['Anda','kamu','kalian'],a:0,e:'Anda が丁寧で無難（頭文字は大文字）。kamu は親しい間柄。名前が分かれば Bapak/Ibu ＋名前で呼ぶのがより自然です。'},
{id:'g116',f:'f2',t:'f2-02',type:'mc',q:'「bukunya」の -nya は何を表しますか。',c:['彼の・その','私の','あなたの'],a:0,e:'-nya は dia（彼・彼女）の短縮形で「彼の／その」。-ku＝私の、-mu＝あなたの。buku saya＝bukuku＝私の本。'},
{id:'g117',f:'f2',t:'f2-03',type:'mc',q:'「彼は賢い」として正しいものは？（賢い＝pintar）',c:['Dia pintar.','Dia adalah pintar.','Dia ada pintar.'],a:0,e:'be動詞は不要。また adalah のうしろに形容詞は置けません。adalah は書き言葉で名詞と名詞をつなぐときに使います。'},
{id:'g118',f:'f2',t:'f2-03',type:'order',q:'これは私の本です。',w:['Ini','buku','saya'],e:'ini（これ）＋buku（本）＋saya（私の）。be動詞なし、所有語はうしろ。この3語の並びが基本形です。',say:'Ini buku saya'},
{id:'g119',f:'f2',t:'f2-04',type:'mc',q:'「私は教師ではありません」の否定語はどれですか。（教師＝guru）',c:['bukan','tidak','belum'],a:0,e:'guru は名詞なので bukan。Saya bukan guru. 動詞・形容詞を否定するなら tidak。'},
{id:'g120',f:'f2',t:'f2-04',type:'mc',q:'「おいしくない」として正しいものは？（おいしい＝enak）',c:['tidak enak','bukan enak','belum enak'],a:0,e:'enak は形容詞なので tidak。bukan は名詞専用です。'},
{id:'g121',f:'f2',t:'f2-04',type:'mc',q:'「Sudah makan?（もう食べた？）」に対し、まだのときの答えは？',c:['Belum.','Tidak.','Bukan.'],a:0,e:'belum＝まだ〜ない。「Tidak」だと「食べません」という拒否になってしまいます。この受け答えは日常で非常によく使われます。'},
{id:'g122',f:'f2',t:'f2-04',type:'mc',q:'「Jangan lupa!」の意味は？',c:['忘れないで！','忘れました','忘れてもいい'],a:0,e:'jangan＝〜するな（禁止）。lupa＝忘れる。tidak（否定）とは働きが違い、命令文を否定します。'},
{id:'g123',f:'f2',t:'f2-04',type:'order',q:'私は日本人ではありません。',w:['Saya','bukan','orang','Jepang'],e:'orang Jepang（日本人）は名詞なので bukan。tidak を使うと誤りになります。',say:'Saya bukan orang Jepang'},
{id:'g124',f:'f3',t:'f3-01',type:'mc',q:'「この本」として正しいものは？',c:['buku ini','ini buku','buku itu ini'],a:0,e:'名詞につく指示詞もうしろ。buku ini＝この本。一方 Ini buku. は「これは本です」という文になります。'},
{id:'g125',f:'f3',t:'f3-01',type:'mc',q:'「Ini mobil mahal.」の意味は？',c:['これは高い車です','この車は高いです','これは車と値段です'],a:0,e:'Ini（これは）＋mobil mahal（高い車）で文全体。「この車は高い」なら Mobil ini mahal. 語順で意味が変わる典型例です。'},
{id:'g126',f:'f3',t:'f3-01',type:'order',q:'あの人は私の友人です。',w:['Orang','itu','teman','saya'],e:'orang itu（あの人）が主語、teman saya（私の友人）が述語。指示詞も所有語もうしろに置きます。',say:'Orang itu teman saya'},
{id:'g127',f:'f3',t:'f3-02',type:'mc',q:'「とてもおいしい」として正しいものを選んでください。',c:['enak sekali','sekali enak','enak sangat'],a:0,e:'sekali は形容詞のうしろ、sangat は前。sangat enak＝enak sekali＝とてもおいしい。'},
{id:'g128',f:'f3',t:'f3-02',type:'mc',q:'「高すぎる」を表す語はどれですか。',c:['terlalu mahal','sangat mahal','lebih mahal'],a:0,e:'terlalu＝〜すぎる。sangat＝とても、lebih＝より。買い物で「Terlalu mahal!」は値切りの定番です。'},
{id:'g129',f:'f3',t:'f3-02',type:'order',q:'これはそれより安いです。',w:['Ini','lebih','murah','daripada','itu'],e:'lebih＋形容詞＋daripada＋比較対象。daripada は dari と略されることもあります。',say:'Ini lebih murah daripada itu'},
{id:'g130',f:'f3',t:'f3-02',type:'mc',q:'「いちばん大きい」を表さないものはどれですか。',c:['lebih besar','paling besar','terbesar'],a:0,e:'lebih besar は「より大きい」（比較級）。最上級は paling besar または ter- をつけた terbesar。'},
{id:'g131',f:'f3',t:'f3-03',type:'mc',q:'店で「安いほうをください」と言うとき、空欄に入るのは？　Minta （　）murah.',c:['yang','itu','dan'],a:0,e:'yang＋形容詞で「〜なほう・〜なもの」という名詞になります。yang ini（こっちの）、yang besar（大きいほう）も頻出。'},
{id:'g132',f:'f3',t:'f3-03',type:'mc',q:'「ごはんを食べている人」として正しいものは？',c:['orang yang makan nasi','orang makan yang nasi','yang orang makan nasi'],a:0,e:'名詞＋yang＋説明。yang のうしろに動詞句をまるごと置いて、前の名詞を説明します。'},
{id:'g133',f:'f3',t:'f3-04',type:'mc',q:'「家で」を表すのはどれですか。（家＝rumah）',c:['di rumah','ke rumah','dari rumah'],a:0,e:'di＝いる場所、ke＝行き先、dari＝出発点。ke rumah＝家へ、dari rumah＝家から。'},
{id:'g134',f:'f3',t:'f3-04',type:'mc',q:'「テーブルの上に」を表すのは？（テーブル＝meja）',c:['di atas meja','di bawah meja','di dalam meja'],a:0,e:'atas＝上、bawah＝下、dalam＝中、luar＝外、depan＝前、belakang＝後ろ、samping＝横。di とセットで覚えます。'},
{id:'g135',f:'f3',t:'f3-04',type:'order',q:'私は友人と学校へ行きます。',w:['Saya','pergi','ke','sekolah','dengan','teman'],e:'主語＋動詞＋方向（ke）＋同伴者（dengan）。dengan は「〜と」のほか「〜で（手段）」にも使います。',say:'Saya pergi ke sekolah dengan teman'},
{id:'g136',f:'f3',t:'f3-04',type:'mc',q:'受動態の di- と前置詞の di の書き分けとして正しいものは？',c:['前置詞は分けて書き、受動の接頭辞はくっつけて書く','どちらも分けて書く','どちらもくっつけて書く'],a:0,e:'di rumah（家で／分ける）と dimakan（食べられる／くっつける）。読解で意味を取り違えないための重要なルールです。'},
{id:'g137',f:'f2',t:'f2-02',type:'mc',q:'「私たちは日本から来ました（相手は別のグループ）」の「私たち」は？',c:['kami','kita','mereka'],a:0,e:'聞き手を含まないので kami。相手も一緒なら kita。mereka は「彼ら」。'},
{id:'g138',f:'f3',t:'f3-03',type:'order',q:'私はこれがほしい。',w:['Saya','mau','yang','ini'],e:'mau＝〜したい・ほしい。yang ini＝こっちのほう。買い物でそのまま使える形です。',say:'Saya mau yang ini'},
{id:'g139',f:'f1',t:'f1-01',type:'mc',q:'語末の k（例：tidak）はどう発音しますか。',c:['飲み込むように詰める','はっきりクと発音する','発音しない'],a:0,e:'tidak＝ティダッ。語末の k は声門閉鎖音になり、詰まるような音になります。'},
{id:'g140',f:'f1',t:'f1-03',type:'mc',q:'「お名前は何ですか」として自然なものは？',c:['Nama Anda siapa?','Nama Anda apa?','Siapa Anda nama?'],a:0,e:'人の名前を尋ねるときは apa（何）ではなく siapa（誰）を使います。Siapa nama Anda? でも同じ意味です。'}
]);</script>
<script>/* id/qg2 */
window.ID_QUESTIONS = (window.ID_QUESTIONS||[]).concat([
{id:'g201',f:'f4',t:'f4-01',type:'mc',q:'「もう食べました」を表す語はどれですか。',c:['sudah','sedang','akan'],a:0,e:'sudah＝もう〜した（完了）。sedang＝〜している最中、akan＝〜するつもり。動詞 makan の形は変わりません。'},
{id:'g202',f:'f4',t:'f4-01',type:'mc',q:'「Saya sedang makan.」の意味は？',c:['私は今食べているところです','私はもう食べました','私はこれから食べます'],a:0,e:'sedang＝進行中。インドネシア語の動詞は活用しないので、時間は前に置く語だけで決まります。'},
{id:'g203',f:'f4',t:'f4-01',type:'mc',q:'「バリに行ったことがあります」の「〜したことがある」は？',c:['pernah','sudah','masih'],a:0,e:'pernah＝経験。Saya pernah ke Bali. sudah は単なる完了、masih は「まだ〜している」。'},
{id:'g204',f:'f4',t:'f4-01',type:'order',q:'私はまだ食べていません。',w:['Saya','belum','makan'],e:'belum＝まだ〜ない。tidak makan（食べない）とは意味が違います。',say:'Saya belum makan'},
{id:'g205',f:'f4',t:'f4-01',type:'mc',q:'「masih」の意味として正しいものは？',c:['まだ〜している','もう〜した','〜したことがある'],a:0,e:'masih＝まだ継続中。Saya masih bekerja.＝まだ働いています。belum（まだ〜ない）と対になります。'},
{id:'g206',f:'f4',t:'f4-02',type:'mc',q:'「10」を表す語はどれですか。',c:['sepuluh','sebelas','seratus'],a:0,e:'sepuluh＝10、sebelas＝11、seratus＝100。se-は「1」を表し、satu puluh とは言いません。'},
{id:'g207',f:'f4',t:'f4-02',type:'mc',q:'「12」はどう言いますか。',c:['dua belas','dua puluh','belas dua'],a:0,e:'11〜19は「〜belas」。dua belas＝12。dua puluh は20なので混同注意。'},
{id:'g208',f:'f4',t:'f4-02',type:'mc',q:'「35」はどう言いますか。',c:['tiga puluh lima','tiga belas lima','lima tiga puluh'],a:0,e:'20以上は「〜puluh」。tiga puluh（30）＋lima（5）。'},
{id:'g209',f:'f4',t:'f4-02',type:'mc',q:'「25,000ルピア」の読みとして正しいものは？',c:['dua puluh lima ribu rupiah','dua lima ribu rupiah','dua puluh lima ratus rupiah'],a:0,e:'25＝dua puluh lima、千＝ribu。ratus は百なので dua puluh lima ratus だと2,500になります。'},
{id:'g210',f:'f4',t:'f4-02',type:'mc',q:'「1番目の」を表す語はどれですか。',c:['pertama','kesatu','kedua'],a:0,e:'順序は ke- をつけますが、1番目だけ pertama という別の語を使います。kedua＝2番目、ketiga＝3番目。'},
{id:'g211',f:'f4',t:'f4-03',type:'mc',q:'人を数えるときの助数詞はどれですか。',c:['orang','ekor','buah'],a:0,e:'orang＝人、ekor＝動物、buah＝もの。tiga orang mahasiswa＝3人の学生。'},
{id:'g212',f:'f4',t:'f4-03',type:'mc',q:'「猫2匹」として正しいものは？（猫＝kucing）',c:['dua ekor kucing','dua orang kucing','kucing dua ekor saja'],a:0,e:'動物は ekor。数える表現では「数詞＋助数詞＋名詞」となり、ここだけ修飾語が前に出ます。'},
{id:'g213',f:'f4',t:'f4-03',type:'mc',q:'「buku-buku」のように語を繰り返すと何を表しますか。',c:['複数（いろいろな本）','強調（とても本らしい）','過去（かつての本）'],a:0,e:'重複（reduplikasi）は複数を表します。anak-anak＝子どもたち。ただし数詞があるときは重複させません（×dua buku-buku）。'},
{id:'g214',f:'f4',t:'f4-03',type:'mc',q:'インドネシア語の名詞について正しいものは？',c:['単数形と複数形の区別がない','語尾に-sをつけて複数にする','複数のときは冠詞が変わる'],a:0,e:'buku は「本」でも「本たち」でも同じ形。数を明示したいときだけ数詞や重複を使います。'},
{id:'g215',f:'f4',t:'f4-04',type:'mc',q:'「いくらですか」を表すのはどれですか。',c:['Berapa harganya?','Apa harganya?','Bagaimana harganya?'],a:0,e:'berapa＝いくつ・いくら。harga＝値段、-nya＝その。買い物の必須表現です。'},
{id:'g216',f:'f4',t:'f4-04',type:'mc',q:'「トイレはどこですか」として正しいものは？',c:['Di mana toilet?','Ke mana toilet?','Dari mana toilet?'],a:0,e:'場所を尋ねるので di mana。ke mana は「どこへ」、dari mana は「どこから」。'},
{id:'g217',f:'f4',t:'f4-04',type:'mc',q:'人の名前を尋ねる疑問詞はどれですか。',c:['siapa','apa','mana'],a:0,e:'名前には siapa（誰）を使います。Siapa nama Anda? apa（何）は物に使います。'},
{id:'g218',f:'f4',t:'f4-04',type:'mc',q:'yes/no で答える疑問文の作り方として正しいものは？',c:['語尾を上げて言うだけでよい','必ず文頭に apa を置く','動詞を文頭に移動する'],a:0,e:'語順を変えずに語尾を上げるだけ。丁寧にするなら文頭に Apakah を置きます。'},
{id:'g219',f:'f4',t:'f4-04',type:'order',q:'あなたはどこへ行きますか。',w:['Anda','mau','ke','mana'],e:'mau＝〜するつもり、ke mana＝どこへ。疑問詞は文末でも文頭でもよく、Ke mana Anda mau? とも言えます。',say:'Anda mau ke mana'},
{id:'g220',f:'f5',t:'f5-01',type:'mc',q:'辞書でインドネシア語の単語を引くとき、何で引きますか。',c:['接辞を外した語根','見たままの形','語尾のアルファベット順'],a:0,e:'mengajar も belajar も語根は ajar。接辞を外して語根で引くのが原則です。これに慣れると語彙が一気に広がります。'},
{id:'g221',f:'f5',t:'f5-01',type:'mc',q:'語根 ajar（教え）から作られた語で「学ぶ」はどれですか。',c:['belajar','mengajar','pelajar'],a:0,e:'belajar＝学ぶ（ber-）、mengajar＝教える（me-）、pelajar＝生徒（pe-）。同じ語根から役割の違う語ができます。'},
{id:'g222',f:'f5',t:'f5-02',type:'mc',q:'kerja（仕事）から「働く」を作ると？',c:['bekerja','berkerja','mengerja'],a:0,e:'ber- ですが、語根が r で始まるため ber-→be- に変化して bekerja。この音変化は例外的で覚えるしかありません。'},
{id:'g223',f:'f5',t:'f5-02',type:'mc',q:'ber- 動詞の性質として正しいものは？',c:['目的語をとらない自動詞を作る','必ず目的語をとる他動詞を作る','受動態を作る'],a:0,e:'ber-＝自動詞（自分がする・持つ・身につける）。他動詞は me-、受動は di-。'},
{id:'g224',f:'f5',t:'f5-02',type:'order',q:'私はジャカルタで働いています。',w:['Saya','bekerja','di','Jakarta'],e:'bekerja（働く）＋di（〜で）＋場所。kerja に ber- がついた形です。',say:'Saya bekerja di Jakarta'},
{id:'g225',f:'f5',t:'f5-03',type:'mc',q:'語根 tulis（書く）に me- をつけるとどうなりますか。',c:['menulis','mentulis','menulisi'],a:0,e:'t は men- の仲間で、しかも t が消えます。men＋(t)ulis＝menulis。p, t, k, s は消えるのがポイントです。'},
{id:'g226',f:'f5',t:'f5-03',type:'mc',q:'語根 baca（読む）に me- をつけると？',c:['membaca','menbaca','mengbaca'],a:0,e:'b は mem- の仲間。b は消えないので membaca。消えるのは p, t, k, s の4つだけです。'},
{id:'g227',f:'f5',t:'f5-03',type:'mc',q:'語根 kirim（送る）に me- をつけると？',c:['mengirim','mengkirim','menkirim'],a:0,e:'k は meng- の仲間で、k が消えます。meng＋(k)irim＝mengirim。'},
{id:'g228',f:'f5',t:'f5-03',type:'mc',q:'語根 ambil（取る）に me- をつけると？',c:['mengambil','menambil','memambil'],a:0,e:'母音で始まる語根は meng-。mengambil。同じく meng＋ajar＝mengajar。'},
{id:'g229',f:'f5',t:'f5-03',type:'mc',q:'me- をつけても語根の頭文字が消えないのはどれですか。',c:['b','p','k'],a:0,e:'消えるのは p, t, k, s の4つ。b, d, g, j などは残ります。membaca（b残る）／memakai（p消える）。'},
{id:'g230',f:'f5',t:'f5-03',type:'mc',q:'語根 lihat（見る）に me- をつけると？',c:['melihat','menglihat','memlihat'],a:0,e:'l, m, n, r, w, y で始まる語根は me- のまま。melihat。'},
{id:'g231',f:'f5',t:'f5-04',type:'mc',q:'bersih（きれいな）から「掃除する」を作ると？',c:['membersihkan','berbersih','pembersih'],a:0,e:'形容詞＋me-...-kan で「〜の状態にする」という他動詞。pembersih は「洗剤・掃除する人」という名詞。'},
{id:'g232',f:'f5',t:'f5-04',type:'mc',q:'「membelikan」が「membeli」と違う点は？',c:['誰かのために買ってあげる、という意味になる','過去のことを表す','否定の意味になる'],a:0,e:'-kan がつくと受益者を目的語にできます。Saya membelikan adik buku.＝弟に本を買ってあげた。'},
{id:'g233',f:'f6',t:'f6-01',type:'mc',q:'「Dilarang merokok」の意味は？',c:['禁煙','喫煙所','喫煙自由'],a:0,e:'larang（禁じる）＋di-（受動）＝禁じられている。merokok＝タバコを吸う。街中の看板で頻出です。'},
{id:'g234',f:'f6',t:'f6-01',type:'mc',q:'受動態を作る接頭辞はどれですか。',c:['di-','me-','ber-'],a:0,e:'me- を di- に置き換えます。membaca（読む）→ dibaca（読まれる）。行為者は oleh で示します。'},
{id:'g235',f:'f6',t:'f6-02',type:'mc',q:'makan（食べる）から「食べ物」を作ると？',c:['makanan','pemakan','kemakanan'],a:0,e:'語根＋-an＝もの・結果。makanan＝食べ物、minuman＝飲み物。メニューでよく見ます。'},
{id:'g236',f:'f6',t:'f6-02',type:'mc',q:'sehat（健康な）から「健康」という抽象名詞を作ると？',c:['kesehatan','pesehat','sehatan'],a:0,e:'ke-＋語根＋-an で抽象名詞。kesehatan（健康）、keamanan（安全）、kemerdekaan（独立）。'},
{id:'g237',f:'f6',t:'f6-02',type:'mc',q:'「pembaca」の意味は？',c:['読者','読むこと','読まれたもの'],a:0,e:'pe-（人・道具）＋baca（読む）＝読む人。penulis（作家）、pekerja（労働者）も同じ作り。'},
{id:'g238',f:'f6',t:'f6-03',type:'mc',q:'「〜できる」を表す語はどれですか。',c:['bisa','mau','harus'],a:0,e:'bisa／dapat＝できる、mau＝したい、harus＝しなければならない、boleh＝してもよい。'},
{id:'g239',f:'f6',t:'f6-03',type:'order',q:'インドネシア語が話せます。',w:['Saya','bisa','berbahasa','Indonesia'],e:'bisa（できる）＋berbahasa（言語を話す）＋Indonesia。bahasa に ber- がついて「〜語を話す」になります。',say:'Saya bisa berbahasa Indonesia'},

 {t:'p',x:'中国語で<b>いちばん大事なのが声調</b>です。同じ「ma」でも高さの動きが違えば別の語になります。音を聞いて真似るのが最短です。<b>🔊のボタンを押して、必ず声に出してください。</b>'},
 {t:'fig', cap:'第1声は高く平ら、第2声は上げる、第3声は低く抑えてから上がる、第4声は上から下へ落とす。軽声は短く添えるだけ。', svg:'<svg viewBox="0 0 520 200" role="img" aria-label="中国語の四声の高さの動きを線で示した図。第1声は高く平ら、第2声は上昇、第3声は低く沈んでから上昇、第4声は下降"><g fill="currentColor" font-size="11.5" text-anchor="middle"><line x1="20" y1="40" x2="500" y2="40" stroke="currentColor" stroke-width="0.8" opacity="0.2"/><line x1="20" y1="70" x2="500" y2="70" stroke="currentColor" stroke-width="0.8" opacity="0.2"/><line x1="20" y1="100" x2="500" y2="100" stroke="currentColor" stroke-width="0.8" opacity="0.2"/><line x1="20" y1="130" x2="500" y2="130" stroke="currentColor" stroke-width="0.8" opacity="0.2"/><text x="12" y="44" font-size="9" text-anchor="end" opacity="0.6">高</text><text x="12" y="134" font-size="9" text-anchor="end" opacity="0.6">低</text><g class="fc-s" stroke-width="2.6" fill="none" stroke-linecap="round"><line x1="40" y1="40" x2="120" y2="40"/><line x1="150" y1="130" x2="230" y2="40"/><path d="M260 100 Q 285 138 300 128 Q 320 118 340 55"/><line x1="370" y1="40" x2="450" y2="130"/></g><text x="80" y="162" font-weight="700">第1声</text><text x="80" y="178" font-size="10">mā　妈（母）</text><text x="190" y="162" font-weight="700">第2声</text><text x="190" y="178" font-size="10">má　麻（麻）</text><text x="300" y="162" font-weight="700">第3声</text><text x="300" y="178" font-size="10">mǎ　马（馬）</text><text x="410" y="162" font-weight="700">第4声</text><text x="410" y="178" font-size="10">mà　骂（ののしる）</text></g></svg>'},
 {t:'ul',x:[
  '<b>第1声（ā）</b>：高いところで平らに伸ばす。歌の「ソ」をまっすぐ。',

  '<b>第4声（à）</b>：高から低へ一気に落とす。「あっ！」と驚いたときの調子。',
  '<b>軽声</b>：声調記号なし。前の音に軽く添える。<b>妈妈 māma</b>（お母さん）の2つめ。',

 ]},

 {t:'key',x:['声調が違えば別の語','第3声は「低く沈む」','第3声＋第3声＝第2声＋第3声','軽声は前に軽く添える']}
]},

{id:'z101',f:'f1',t:'f1-01',type:'mc',q:'「妈 mā（母）」の声調はどれですか。',c:['第1声（高く平ら）','第2声（上げる）','第4声（下げる）'],a:0,e:'mā は第1声。高いところで平らに伸ばします。má（麻）は第2声、mǎ（马）は第3声、mà（骂）は第4声。',say:'妈'},
{id:'z102',f:'f1',t:'f1-01',type:'mc',q:'「马 mǎ（馬）」の声調はどれですか。',c:['第3声（低く沈む）','第1声','第2声'],a:0,e:'mǎ は第3声。会話では低く沈むだけで、最後まで上げないことが多いです。',say:'马'},
{id:'z103',f:'f1',t:'f1-01',type:'mc',q:'「你好 nǐ hǎo」は実際にはどう読まれますか。',c:['ní hǎo（前が第2声に変わる）','nǐ háo（後ろが第2声に変わる）','nǐ hǎo（そのまま）'],a:0,e:'第3声が連続すると前の第3声が第2声に変わります（三声変調）。表記は変えませんが、発音は ní hǎo です。',say:'你好'},
{id:'z104',f:'f1',t:'f1-01',type:'mc',q:'「妈妈 māma」の2つめの ma のように、声調記号がつかない音を何といいますか。',c:['軽声','第1声','第5声'],a:0,e:'軽声。前の音に短く軽く添えます。爸爸 bàba、谢谢 xièxie なども同じです。',say:'妈妈'},
{id:'z105',f:'f1',t:'f1-02',type:'mc',q:'ピンインの zh, ch, sh, r に共通する発音の特徴は？',c:['舌を反らせて出す','唇を丸めて出す','鼻から抜く'],a:0,e:'そり舌音です。j, q, x は舌を平らにするので別グループ。中国 Zhōngguó、吃 chī、是 shì、人 rén。',say:'中国'},
{id:'z106',f:'f1',t:'f1-02',type:'mc',q:'「去 qù」の u は実際にはどの音ですか。',c:['ü（口をウの形でイ）','普通のウ','オ'],a:0,e:'j, q, x のあとの u は ü の音です。表記では点を省きますが、音は ü。女 nǚ の ü と同じ音です。',say:'去'},
{id:'z107',f:'f1',t:'f1-03',type:'mc',q:'「不」が bú（第2声）に変わるのはどんなときですか。',c:['第4声の前','第1声の前','第3声の前'],a:0,e:'第4声の前で bú になります。不是 bú shì、不去 bú qù。第1〜3声の前は bù のまま（不好 bù hǎo）。',say:'不是'},
{id:'z108',f:'f1',t:'f1-03',type:'mc',q:'「谢谢」に対する返事として自然なものは？',c:['不客气','对不起','没关系'],a:0,e:'不客气 bú kèqi＝どういたしまして。对不起＝ごめんなさい、没关系＝大丈夫です（謝られたときの返事）。',say:'不客气'},
{id:'z109',f:'f1',t:'f1-03',type:'mc',q:'目上の人に「こんにちは」と言うときに使うのは？',c:['您好','你好','喂'],a:0,e:'您 nín は 你 の丁寧形。喂 wéi は電話の「もしもし」や呼びかけです。',say:'您好'},
{id:'z110',f:'f2',t:'f2-01',type:'order',q:'私はごはんを食べます。',w:['我','吃','米饭'],e:'主語＋動詞＋目的語（SVO）。日本語と違って動詞が目的語より前に来ます。',say:'我吃米饭'},
{id:'z111',f:'f2',t:'f2-01',type:'order',q:'私は明日北京へ行きます。',w:['我','明天','去','北京'],e:'時間を表す語（明天）は動詞の前に置きます。英語のように文末には置きません。',say:'我明天去北京'},
{id:'z112',f:'f2',t:'f2-01',type:'order',q:'私は家でごはんを食べます。',w:['我','在家','吃饭'],e:'場所（在家）も動詞の前。「いつ・どこで」→動詞→目的語、という順番が基本です。',say:'我在家吃饭'},
{id:'z113',f:'f2',t:'f2-01',type:'mc',q:'中国語の基本語順はどれですか。',c:['主語→動詞→目的語','主語→目的語→動詞','動詞→主語→目的語'],a:0,e:'SVO で英語に近い語順です。ただし時間・場所は動詞の前に置く点が英語と違います。',say:'我吃米饭'},
{id:'z114',f:'f2',t:'f2-02',type:'mc',q:'「彼は元気です」として正しいものは？',c:['他很好。','他是好。','他有好。'],a:0,e:'形容詞述語文には 是 を使いません。很 を置きます。この 很 は「とても」の意味がほとんどなく、形を整えるために入ります。',say:'他很好'},
{id:'z115',f:'f2',t:'f2-02',type:'mc',q:'「私は日本人です」として正しいものは？',c:['我是日本人。','我很日本人。','我有日本人。'],a:0,e:'名詞述語文なので 是。形容詞なら 很 を使います。この使い分けが初級最大の落とし穴です。',say:'我是日本人'},
{id:'z116',f:'f2',t:'f2-02',type:'mc',q:'形容詞述語文の「很」について正しいものは？',c:['「とても」の意味はほとんどなく、形を整えるために入る','必ず「とても」という強い意味になる','省略しても意味は変わらない'],a:0,e:'本当に強調したいときは 非常 や 真 を使います。很 を省くと比較のニュアンスが出てしまいます。',say:'他很好'},
{id:'z117',f:'f2',t:'f2-03',type:'mc',q:'「私はお金がありません」として正しいものは？',c:['我没有钱。','我不有钱。','我没钱有。'],a:0,e:'有 の否定は必ず 没有。不有 とは絶対に言いません。中国語で数少ない「不が使えない」動詞です。',say:'我没有钱'},
{id:'z118',f:'f2',t:'f2-03',type:'mc',q:'「机の上に本が1冊あります」として正しい形は？',c:['桌子上有一本书。','书有桌子上。','一本书在有桌子上。'],a:0,e:'「場所＋有＋もの」で存在を表します。逆に「もの＋在＋場所」なら 书在桌子上（本は机の上にある）。',say:'桌子上有一本书'},
{id:'z119',f:'f2',t:'f2-03',type:'mc',q:'「私の母」として自然なものは？',c:['我妈妈','我的妈妈（誤りではないが不自然）','妈妈的我'],a:0,e:'家族や所属を表すときは 的 を省くのが自然です。我们学校（私たちの学校）も同じ。',say:'我妈妈'},
{id:'z120',f:'f2',t:'f2-04',type:'mc',q:'「你去哪儿吗？」が誤りである理由は？',c:['疑問詞と吗を併用しているから','哪儿の位置が違うから','去の前に不が必要だから'],a:0,e:'疑問詞（哪儿）がすでに疑問を表しているので 吗 は不要です。正しくは 你去哪儿？',say:'你去哪儿'},
{id:'z121',f:'f2',t:'f2-04',type:'mc',q:'「あなたは日本人ですか」を反復疑問文で言うと？',c:['你是不是日本人？','你是日本人吗吗？','你不是日本人吗？'],a:0,e:'肯定＋否定を並べるのが反復疑問文。吗 とは併用しません。你不是日本人吗？は「日本人じゃないんですか？」という別の意味です。',say:'你是不是日本人'},
{id:'z122',f:'f2',t:'f2-04',type:'mc',q:'「私は元気です、あなたは？」の「あなたは？」にあたるのは？',c:['你呢？','你吗？','你吧？'],a:0,e:'呢 ne は「〜は？」と聞き返すときに使います。吧 ba は「〜でしょう／〜しよう」。',say:'你呢'},
{id:'z123',f:'f2',t:'f2-04',type:'mc',q:'「いくつ」を尋ねるとき、10未満が想定される場合に使う語は？',c:['几','多少','什么'],a:0,e:'几 jǐ は10未満、多少 duōshao は数の大小を問わず使えます。几个人？＝何人？（少人数を想定）',say:'几个人'},
{id:'z124',f:'f3',t:'f3-01',type:'mc',q:'「本2冊」として正しいものは？',c:['两本书','二本书','两书'],a:0,e:'数量の「2」は 两。また数詞と名詞の間に量詞 本 が必要で、省略できません。',say:'两本书'},
{id:'z125',f:'f3',t:'f3-01',type:'mc',q:'「一」が yí（第2声）になるのはどんなときですか。',c:['第4声の前','第1声の前','いつも yí'],a:0,e:'一个 yí ge のように第4声の前で yí。第1〜3声の前は yì（一本 yì běn）。不 と同じ発想の変調です。',say:'一个'},
{id:'z126',f:'f3',t:'f3-01',type:'mc',q:'「この人」として正しいものは？',c:['这个人','这人（やや不自然）','这的人'],a:0,e:'这／那＋量詞＋名詞。量詞 个 を飛ばせません。这本书（この本）、那张票（あの切符）も同じ形です。',say:'这个人'},
{id:'z127',f:'f3',t:'f3-01',type:'mc',q:'猫を数えるときの量詞はどれですか。',c:['只','本','张'],a:0,e:'只 zhī は動物。本 は本・冊子、张 は平らなもの（紙・机・切符）。迷ったら万能の 个 が使えます。',say:'一只猫'},
{id:'z128',f:'f3',t:'f3-02',type:'order',q:'私が昨日買った服',w:['我','昨天','买','的','衣服'],e:'修飾語は名詞の前に置きます。日本語と同じ語順なので組み立てやすい部分です。',say:'我昨天买的衣服'},
{id:'z129',f:'f3',t:'f3-02',type:'mc',q:'「的」を省くのが自然なのはどれですか。',c:['我妈妈（家族）','好吃的菜（形容詞2音節）','我买的书（動詞句）'],a:0,e:'家族・所属は 的 を省きます。1音節の形容詞＋名詞（好人、新书）も省きます。',say:'我妈妈'},
{id:'z130',f:'f3',t:'f3-03',type:'mc',q:'「私は彼より背が高い」として正しいものは？',c:['我比他高。','我比他很高。','我高比他。'],a:0,e:'A比B＋形容詞。比の文では 很 を使いません。これが形容詞述語文との大きな違いです。',say:'我比他高'},
{id:'z131',f:'f3',t:'f3-03',type:'mc',q:'「私は彼ほど背が高くない」として正しいものは？',c:['我没有他高。','我不比他高。','我不有他高。'],a:0,e:'比較の否定は 没有。我不比他高 は「彼より高いわけではない」という別のニュアンスです。',say:'我没有他高'},
{id:'z132',f:'f3',t:'f3-03',type:'mc',q:'「これはあれと同じくらい高い」の「同じくらい」にあたるのは？',c:['跟…一样','比…一样','和…最'],a:0,e:'A跟B一样＋形容詞。这个跟那个一样贵。和 hé でも代用できます。',say:'这个跟那个一样贵'},
{id:'z133',f:'f3',t:'f3-04',type:'order',q:'本は机の上にあります。',w:['书','在','桌子上'],e:'「もの＋在＋場所」。場所は「桌子＋上」で作ります。存在を言う「场所＋有＋もの」と対で覚えます。',say:'书在桌子上'},
{id:'z134',f:'f3',t:'f3-04',type:'mc',q:'「家は駅から近い」の「〜から（距離）」にあたるのは？',c:['离','从','到'],a:0,e:'离 lí は2点間の距離。从 cóng は出発点（从东京到北京）。我家离车站很近。',say:'我家离车站很近'},
{id:'z135',f:'f4',t:'f4-01',type:'mc',q:'「了」について正しいものは？',c:['過去形ではなく、完了や変化を表す','必ず過去のことにしか使えない','未来には絶対に使えない'],a:0,e:'了 は時制ではありません。明天下了课…（明日授業が終わったら）のように未来にも使います。',say:'我吃了饭'},
{id:'z136',f:'f4',t:'f4-01',type:'mc',q:'「私はまだ食べていません」として正しいものは？',c:['我还没吃饭。','我还没吃了饭。','我还不吃饭。'],a:0,e:'没 で否定すると 了 は消えます。不吃 だと「食べない（意思）」という意味になってしまいます。',say:'我还没吃饭'},
{id:'z137',f:'f4',t:'f4-01',type:'mc',q:'「中国へ行ったことがあります」の「〜したことがある」は？',c:['过','了','在'],a:0,e:'过 guo＝経験。我去过中国。了 は完了、在 は進行中（我在吃饭＝食事中）。',say:'我去过中国'},
{id:'z138',f:'f4',t:'f4-01',type:'mc',q:'「私は今食事中です」として正しいものは？',c:['我在吃饭。','我了吃饭。','我过吃饭。'],a:0,e:'在＋動詞で進行中。正在 zhèngzài とも言います。',say:'我在吃饭'},
{id:'z139',f:'f4',t:'f4-02',type:'mc',q:'「2時」を中国語で言うと？',c:['两点','二点','双点'],a:0,e:'時刻の2は 两。二点 とは言いません。两点半＝2時半。',say:'两点半'},
{id:'z140',f:'f4',t:'f4-03',type:'mc',q:'「中国語が話せます（習得した技能）」として自然なものは？',c:['我会说汉语。','我能说汉语。','我可以说汉语。'],a:0,e:'会＝習得した技能。能＝状況的に可能、可以＝許可。「今日は声が出るから話せる」なら 能。',say:'我会说汉语'},
{id:'z141',f:'f4',t:'f4-03',type:'mc',q:'「入ってもいいですか」として自然なものは？',c:['可以进来吗？','会进来吗？','要进来吗？'],a:0,e:'可以＝許可を求める。会 は技能、要 は意志・予定です。',say:'可以进来吗'},
{id:'z142',f:'f4',t:'f4-04',type:'mc',q:'「私も行きます」として正しいものは？',c:['我也去。','我去也。','也我去。'],a:0,e:'副詞 也 は主語のあと・動詞の前に固定です。文末には置けません。',say:'我也去'},
{id:'z143',f:'f4',t:'f4-04',type:'mc',q:'「私たちはみんな学生です」の「みんな」にあたるのは？',c:['都','也','还'],a:0,e:'都 dōu＝すべて。我们都是学生。也 と並べるときは「也都」の順になります。',say:'我们都是学生'},
{id:'z144',f:'f5',t:'f5-01',type:'mc',q:'「聞いて分かる」を表すのはどれですか。',c:['听懂','听完','听见'],a:0,e:'懂＝理解できた。完＝し終わる、见＝知覚できた（听见＝聞こえる）。動詞のうしろに1字足して結果を表します。',say:'听懂'},
{id:'z145',f:'f5',t:'f5-01',type:'mc',q:'「読み終わった」を表すのはどれですか。',c:['看完了','看懂了','看见了'],a:0,e:'完＝し終わる。看懂了は「読んで分かった」、看见了は「見えた」。結果補語で意味が変わります。',say:'看完了'},
{id:'z146',f:'f5',t:'f5-02',type:'mc',q:'把構文で誤っているものはどれですか。',c:['我把书看。','我把书看完了。','请把门关上。'],a:0,e:'把構文では動詞のうしろに必ず何かが必要です。動詞1字だけでは成立しません。',say:'我把书看完了'},
{id:'z147',f:'f5',t:'f5-02',type:'order',q:'ドアを閉めてください。',w:['请','把','门','关上'],e:'请＋把＋目的語＋動詞＋結果補語。关上 の 上 が結果を表しています。',say:'请把门关上'},
{id:'z148',f:'f5',t:'f5-03',type:'mc',q:'「財布を盗まれました」として自然なものは？',c:['我的钱包被偷了。','我的钱包把偷了。','我的钱包让偷。'],a:0,e:'被＝受身。好ましくないことに使うのが基本で、行為者は省略できます。',say:'我的钱包被偷了'},
{id:'z149',f:'f5',t:'f5-03',type:'mc',q:'「母は私に勉強させる」の「〜させる」にあたるのは？',c:['让','被','把'],a:0,e:'让 ràng＝〜させる（使役）。妈妈让我学习。被 は受身です。',say:'妈妈让我学习'},
{id:'z150',f:'f5',t:'f5-04',type:'mc',q:'「是…的」構文が使えるのはどんなときですか。',c:['すでに起きたことの、いつ・どこで・どうやってを強調するとき','これからの予定を言うとき','命令するとき'],a:0,e:'我是昨天来的（昨日来たのです）。未来のことには使えません。',say:'我是昨天来的'},
{id:'z151',f:'f6',t:'f6-01',type:'mc',q:'「高すぎます」として正しいものは？',c:['太贵了。','很贵太。','贵太了。'],a:0,e:'太…了 で「〜すぎる」。太好了！は「よかった！」という喜びの表現にもなります。',say:'太贵了'},
{id:'z152',f:'f6',t:'f6-01',type:'mc',q:'「ちょっと見てもいいですか」として自然なものは？',c:['我可以看看吗？','我可以看吗看？','我看看可以吗看？'],a:0,e:'動詞を重ねると「ちょっと〜する」という軽いニュアンスになります。试试（試してみる）も同じです。',say:'我可以看看吗'},
{id:'z153',f:'f6',t:'f6-02',type:'mc',q:'「どう行けばいいですか」として正しいものは？',c:['怎么走？','什么走？','哪儿走？'],a:0,e:'怎么＋動詞＝どうやって〜する。怎么说（どう言う）、怎么办（どうしよう）も頻出です。',say:'怎么走'},
{id:'z154',f:'f6',t:'f6-02',type:'order',q:'すみません、駅はどこですか。',w:['请问','车站','在','哪儿'],e:'请问 で丁寧に切り出し、「もの＋在＋哪儿」で場所を尋ねます。',say:'请问车站在哪儿'},
{id:'z155',f:'f6',t:'f6-03',type:'mc',q:'「高いけれどおいしい」として自然なものは？',c:['虽然贵，但是好吃。','因为贵，所以好吃。','如果贵，就好吃。'],a:0,e:'虽然…但是…＝〜だけれど〜。中国語は接続詞を前後で対にして使います。',say:'虽然贵但是好吃'},
{id:'z156',f:'f6',t:'f6-04',type:'mc',q:'中国語の「手纸」の意味は？',c:['トイレットペーパー','手紙','手袋'],a:0,e:'手紙は 信 xìn。日本語と字が同じでも意味が違う語に注意。汽车＝自動車（汽車は火车）、勉强＝無理強い（勉強は学习）。',say:'手纸'},
{id:'z157',f:'f6',t:'f6-04',type:'mc',q:'中国語の「爱人」の意味は？',c:['配偶者','不倫相手','恋人未満の相手'],a:0,e:'爱人 àiren は夫または妻のこと。日本語の「愛人」とはまったく違います。',say:'爱人'},
{id:'z158',f:'f6',t:'f6-04',type:'mc',q:'「大丈夫ですか」と尋ねたいとき、中国語の「大丈夫」を使ってはいけない理由は？',c:['中国語の大丈夫は「立派な男」という意味だから','中国語に大丈夫という語がないから','失礼な言い方になるから'],a:0,e:'「大丈夫？」は 没关系吗？ や 没事儿吧？ と言います。',say:'没事儿吧'},
{id:'z159',f:'f4',t:'f4-02',type:'mc',q:'「星期天」の意味は？',c:['日曜日','土曜日','毎週'],a:0,e:'星期一〜星期六が月曜〜土曜で、日曜だけ 星期天（星期日）。数字ではない点に注意。',say:'星期天'},
{id:'z160',f:'f3',t:'f3-01',type:'order',q:'この2冊の本',w:['这','两','本','书'],e:'指示詞＋数詞＋量詞＋名詞。2は 两 を使い、量詞 本 は省けません。',say:'这两本书'}

<script>

       tableSay:/^[A-Za-z][A-Za-z\s\-']*$/,
       inpHint:'アルファベットで入力。大文字小文字・記号は気にしなくてOK。',
       sugg:['DM法則って何？','tidak と bukan の違いは？','me- の音変化を整理して','あいさつをまとめて'] },
  zh:{ code:'zh', tag:'中', name:'中国語', voice:'zh-CN', pron:'ピンイン',
       tb:window.ZH_TEXTBOOK, qs:window.ZH_QUESTIONS,
       tableSay:/[\u4e00-\u9fff]/,
       inpHint:'漢字でも、声調記号なしのピンイン（nihao）でもOK。',
       sugg:['四声のコツを教えて','是 と 很 の使い分けは？','了 の使い方を整理して','量詞をまとめて'] }
};
var LCODES = ['id','zh'];
var MODES = {g:'文法', v:'単語'};
var LS = 'lang-drill-v1';
var DAY = 86400000, INTERVALS = [1,2,4,8,16], SET_N = 20;

var lang = 'id', mode = 'g', hard = true;
var L, TB, QS, VOICE, FIELDS, QMAP, QBY, TMAP, TWIN, ALLTOPICS;
function buildLang(){
  L = LANGS[lang];
  TB = L.tb || {}; QS = (L.qs || []).slice(); VOICE = L.voice || 'en-US';
  FIELDS = Object.keys(TB);
  QMAP = {}; QBY = {g:{}, v:{}}; TMAP = {}; TWIN = {}; ALLTOPICS = 0;
  FIELDS.forEach(function(f){
    QBY.g[f] = []; QBY.v[f] = [];
    TB[f].topics.forEach(function(t){ TMAP[t.id] = {t:t, f:f}; ALLTOPICS++; });
  });
  QS.forEach(function(q){
    QMAP[q.id] = q; var e = exOf(q); if(QBY[e][q.f]) QBY[e][q.f].push(q);
    if(q.inp && q.say && !TWIN[q.say]) TWIN[q.say] = q;
  });
  document.documentElement.setAttribute('data-lang', lang);
  var t = document.getElementById('appTitle'); if(t) t.textContent = L.name+'ドリル';
  Array.prototype.forEach.call(document.querySelectorAll('#langSw button'), function(b){
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
  loadVoices();
}
function exOf(q){ return q.ex === 'v' ? 'v' : 'g'; }
function pool(m){ m = m || mode; var o = []; FIELDS.forEach(function(f){ o = o.concat(QBY[m][f]||[]); }); return o; }
function poolBy(f, m){ return QBY[m || mode][f] || []; }
function modeName(){ return MODES[mode]; }

/* ---------- 入力式 ---------- */
/* その問題が「自分で入力」できるか。できるなら受けつける答えの配列を返す */
function answersFor(q){
  if(!q) return null;
  if(q.type === 'order') return [q.say || q.w.join(' '), q.w.join(' ')];
  if(q.inp && q.inp.length) return q.inp.slice();
  return null;
}
function typable(q){ return !!answersFor(q); }
/* 答える前に発音を聞いてよいか。答えそのものが読み上げられる問題では出さない */
function canHearBefore(q){
  if(!q.say || q.type === 'order') return false;
  var a = answersFor(q);
  return !(a && matches(q.say, a));
}
function norm(s){
  s = String(s).toLowerCase();
  try{ s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }catch(e){}
  return s.replace(/[\s\u3000.,!?;:'"\u2018\u2019\u201c\u201d、。！？，；：（）()\-]/g, '');
}
function matches(raw, list){
  var g = norm(raw);
  if(!g) return false;
  return (list||[]).some(function(a){ return norm(a) === g; });
}
/* 入力式のときは、同じ語の「産出方向（入力できる）」の問題に差し替える */
function toHard(q){

var chartField = null, tipTimer = null;
function sessionsFor(){
  return (S.sessions||[]).filter(function(x){
    if(!x||!x.total) return false;
    if((x.ex||'g') !== mode) return false;
    if(chartField && x.f !== chartField) return false;
    if(!chartField && x.kind === 'topic') return false;
    return true;
  }).slice().sort(function(a,b){ return a.at-b.at; });
}
function renderChart(){
  var data = sessionsFor();
  var cc = chartField ? 'var(--'+chartField+')' : 'var(--accent)';
  var h = '<div class="fchips" style="--cc:'+cc+'"><button data-act="cf:" aria-pressed="'+(!chartField)+'">全体</button>';
  FIELDS.forEach(function(f){ h += '<button data-act="cf:'+f+'" aria-pressed="'+(chartField===f)+'" style="--cc:var(--'+f+')">'+esc(TB[f].short)+'</button>'; });
  h += '</div>';
  if(!data.length) return h + '<div class="empty">まだ'+esc(modeName())+'の記録がありません。<br>練習を1回やると推移が出ます。</div>';
  var W=360,H=176,Lp=28,R=30,TP=14,B=28, pw=W-Lp-R, ph=H-TP-B, n=data.length;
  var X = function(i){ return n===1 ? Lp+pw/2 : Lp+pw*i/(n-1); };
  var Y = function(v){ return TP+ph*(1-v/100); };
  var pct = data.map(function(d){ return Math.round(d.correct/d.total*100); });
  var run = 0, avgS = []; pct.forEach(function(v,i){ run += v; avgS.push(run/(i+1)); });
  var main = chartField ? pct : avgS;
  var g = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(modeName())+'の正答率の推移">';
  [0,25,50,75,100].forEach(function(v){
    g += '<line class="grid" x1="'+Lp+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'"/>';
    g += '<text x="'+(Lp-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>'; });
  if(!chartField) pct.forEach(function(v,i){ g += '<circle class="raw" cx="'+X(i)+'" cy="'+Y(v)+'" r="3"/>'; });
  if(n>1) g += '<polyline class="ln" points="'+main.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
  main.forEach(function(v,i){ var last = i===n-1;
    g += '<circle class="pt'+(last?' last':'')+'" cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(last?4.5:3.5)+'"/>';
    g += '<circle class="hit" cx="'+X(i)+'" cy="'+Y(v)+'" r="16" data-pt="'+i+'"/>'; });
  var lv = Math.round(main[n-1]);
  g += '<text class="val" x="'+(X(n-1)+8)+'" y="'+(Y(lv)+(lv>85?12:-7))+'" text-anchor="'+(n===1?'middle':'end')+'">'+lv+'%</text>';
  var d0 = new Date(data[0].at), d1 = new Date(data[n-1].at);
  g += '<text x="'+Lp+'" y="'+(H-10)+'" text-anchor="start">'+(d0.getMonth()+1)+'/'+d0.getDate()+'</text>';
  if(n>1) g += '<text x="'+(W-R)+'" y="'+(H-10)+'" text-anchor="end">'+(d1.getMonth()+1)+'/'+d1.getDate()+'</text>';
  g += '</svg>';
  h += '<div class="chartwrap" id="chartwrap" style="--cc:'+cc+'">'+g+'<div id="tip" hidden></div></div>';
  if(!chartField) h += '<div class="legend"><span><i class="k-ln"></i>全体の平均（累計）</span><span><i class="k-raw"></i>各回の点数</span></div>';
  var avg = Math.round(pct.reduce(function(a,b){return a+b;},0)/n), best = Math.max.apply(null,pct);
  var delta = n>1 ? Math.round(main[n-1])-Math.round(main[n-2]) : null;
  h += '<div class="statrow"><div><b class="num">'+avg+'%</b><small>全体の平均</small></div>'+
    '<div><b class="num">'+pct[n-1]+'%</b><small>直近の点</small></div>'+
    '<div><b class="num">'+best+'%</b><small>最高</small></div>'+
    '<div><b class="num">'+(delta===null?'—':(delta>0?'+':'')+delta)+'</b><small>平均の増減</small></div></div>';
  h += '<p class="tiny muted" style="margin:9px 0 0">点をタップすると日付と内訳が出ます。</p>';
  return h;
}
function showTip(i){

    '<small>'+(dt.getMonth()+1)+'/'+dt.getDate()+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0')+'　'+esc(d.label||'')+'</small>';
  tip.style.left = (hr.left-wr.left+hr.width/2)+'px';

  mode = r.ex || 'g';
  quiz = { list:list, i:Math.min(r.i||0,list.length), correct:r.correct||0, label:r.label||'続き',
           log:r.log||[], done:false, kind:r.kind||'other', f:r.f||null, ex:mode, order:null, shown:false };
  quizTab = r.tab || 'drill';

function renderQuiz(){

function finish(q, ok, extra, got){
  record(q.id, ok);
  if(ok) quiz.correct++;
  quiz.log.push({id:q.id, correct:ok});
  quiz.done = true;
  var info = TMAP[q.t];
  var h = '<div class="verdict '+(ok?'ok':'ng')+'"><div class="v">'+(ok?'◎ 正解':'× 不正解')+'</div>';
  if(got && !ok) h += '<div class="yourans">あなたの答え：<b>'+esc(got)+'</b></div>';
  if(extra) h += '<div style="margin-bottom:7px">'+(ok?'':'正解：')+'<b class="tgt" style="font-size:16px">'+esc(extra)+'</b> '+(q.say?sayBtn(q.say):'')+'</div>';
  h += '<div>'+q.e+'</div>';
  if(info) h += '<div class="lnk"><button data-act="topic:'+q.t+'">→ 教科書：'+esc(info.t.title)+'</button></div>';
  h += '</div>';
  if(sampleFn) h += '<button class="askbtn" data-act="askq:'+q.id+'">この問題について質問する</button>';
  h += '<button class="btn primary sticky-act" id="nextBtn">'+(quiz.i+1>=quiz.list.length?'結果を見る':'次の問題へ')+'</button>';
  var fb = document.getElementById('fb'); fb.innerHTML = h;
  var nb = document.getElementById('nextBtn');
  nb.addEventListener('click', function(){ quiz.i++; quiz.done = false; quiz.order = null; quiz.shown = false;
    saveQuiz(); renderQuiz(); window.scrollTo(0,0); });
  if(q.say && speakOn) setTimeout(function(){ speak(q.say); }, 260);
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function pick(i){
  if(!quiz || quiz.done) return;
  var q = quiz.list[quiz.i], ok = (i === q.a);
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(b){
    var idx = Number(b.dataset.pick); b.disabled = true;
    var mk = b.querySelector('.mk');
    if(idx === q.a){ b.classList.add('ok'); if(mk) mk.textContent = '✓'; }
    else if(idx === i){ b.classList.add('ng'); if(mk) mk.textContent = '✕'; } });
  finish(q, ok, null);
}
function inpCheck(){
  if(!quiz || quiz.done) return;
  var q = quiz.list[quiz.i], el = document.getElementById('ans');
  if(!el) return;
  var raw = el.value.trim();
  if(!raw){ el.focus(); return; }
  var ans = answersFor(q) || [], ok = matches(raw, ans);
  el.disabled = true; el.classList.add(ok ? 'ok' : 'ng');
  var cb = document.querySelector('[data-act="inpcheck"]'); if(cb) cb.remove();
  var gb = document.querySelector('[data-act="giveup"]'); if(gb) gb.remove();
  try{ el.blur(); }catch(e){}
  finish(q, ok, q.type === 'order' ? (q.say || q.w.join(' ')) : ans[0], raw);
}
function giveUp(){
  if(!quiz || quiz.done) return;
  quiz.shown = true;
  renderQuiz();
}
function orderCheck(){
  if(!quiz || quiz.done) return;
  var q = quiz.list[quiz.i], got = quiz.order.picked.map(function(t){ return t.w; });
  var ok = got.join(' ') === q.w.join(' ');

    el.disabled = true; el.classList.add(got[i] === q.w[i] ? 'ok' : 'ng'); });

  finish(q, ok, q.w.join(' '));
}

function mockSet(){
  var out = []; FIELDS.forEach(function(f){ out = out.concat(setOf(poolBy(f), 7)); });
  return dedupe(shuffle(out)).slice(0,40);
}
function pickWeak(n){
  var w = weakList(), d = dueList().filter(function(q){ return w.indexOf(q) < 0; });
  return w.concat(d).slice(0,n);
}

/* ---------- 質問 ---------- */
var ask = { ctx:null, turns:[], busy:false, partial:'', err:'', ctl:null, draft:'' };
function rules(){
  return [
   'あなたは'+L.name+'の先生です。学習者は日本語話者の初学者です。',
   '次のルールで答えてください。',
   '・日本語で、簡潔に。まず結論、次に理由。前置きは書かない。',
   '・'+L.name+'の例文を必ず1〜2つ出し、日本語訳をつける。',
   (L.pron ? '・例文には'+L.pron+'も添える。' : ''),
   '・初学者が間違えやすい点があれば最後に一行で指摘する。',
   '・分からないことは分からないと答える。',
   '・全体で400字程度。長くしない。'
  ].filter(Boolean).join('\n');
}
function topicText(t){
  var out = [t.title,''];
  (t.blocks||[]).forEach(function(b){
    if(b.t==='p') out.push(strip(b.x));
    else if(b.t==='ul') b.x.forEach(function(li){ out.push('・'+strip(li)); });
    else if(b.t==='table'){ out.push(b.head.map(strip).join(' / ')); b.rows.forEach(function(r){ out.push(r.map(strip).join(' / ')); }); }
    else if(b.t==='ex'){ out.push('例：'+strip(b.q)); out.push('→ '+strip(b.a)); }
    else if(b.t==='key') (Array.isArray(b.x)?b.x:[b.x]).forEach(function(k){ out.push('ポイント：'+strip(k)); });
    else if(b.t==='warn') out.push('注意：'+strip(b.x));
    else if(b.t==='fig'){ if(b.cap) out.push('図：'+strip(b.cap)); }
    else if(b.t==='cmp') ['a','b'].forEach(function(s){ var d=b[s]; if(!d) return; out.push('【'+strip(d.t)+'】'); (d.x||[]).forEach(function(li){ out.push('・'+strip(li)); }); });
  });
  return out.join('\n').slice(0,3000);
}
function ctxText(c){
  if(!c) return '';
  if(c.kind==='q'){ var q = QMAP[c.id]; if(!q) return '';
    return '【いま解いた問題】\n'+q.q+'\n'+(q.type==='order'?('正解：'+q.w.join(' ')):
      q.c.map(function(o,i){ return (i+1)+'. '+o+(i===q.a?'  ←正解':''); }).join('\n'))+'\n解説：'+strip(q.e); }
  if(c.kind==='t'){ var i = TMAP[c.id]; return i ? '【いま読んでいる章】\n'+topicText(i.t) : ''; }
  return '';
}
function ctxLabel(c){
  if(!c) return '';
  if(c.kind==='q'){ var q = QMAP[c.id]; return q ? 'この問題について：'+q.q.slice(0,40) : ''; }
  if(c.kind==='t'){ var i = TMAP[c.id]; return i ? 'この章について：'+i.t.title : ''; }
  return '';
}
function openAsk(kind,id){
  var same = ask.ctx && ask.ctx.kind===kind && ask.ctx.id===id;
  if(!same){ ask.ctx = kind?{kind:kind,id:id}:null; ask.turns = []; ask.partial=''; ask.err=''; }
  renderAsk(); show('ask');
  setTimeout(function(){ var t = document.getElementById('askInput'); if(t) t.focus(); }, 60);
}
function fmt(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/^[-*・]\s+/gm,'・'); }
function renderAsk(){
  var box = document.getElementById('v-ask'); if(!box) return;
  var h = '<h2 class="disp" style="font-size:19px;margin:2px 0 2px">質問</h2>';
  if(!sampleFn){ box.innerHTML = h + '<div class="card"><div class="empty">この画面ではClaudeに質問できません。<br>claude.ai で開き直すと使えます。</div></div>'; return; }
  h += '<p class="tiny muted" style="margin:0 0 12px">分からないところを、そのまま聞いてください。</p>';
  if(ask.ctx) h += '<div class="askctx"><span class="l">文脈</span><span>'+esc(ctxLabel(ask.ctx))+'</span><button class="x" data-act="askclear">×</button></div>';
  h += '<div class="card">';
  if(!ask.turns.length && !ask.busy){
    h += '<div class="empty" style="padding:14px 6px">'+(ask.ctx?'この内容について何でも聞けます。':'文法でも単語でも、なんでもどうぞ。')+'</div><div class="sugg">';
    (ask.ctx ? ['なぜその答えになるの？','似た表現との違いは？','もう1つ例文を','どんな場面で使う？']
             : (L.sugg || ['基本の語順は？','よく使うあいさつは？','発音のコツは？'])).forEach(function(x){
      h += '<button data-sugg="'+esc(x)+'">'+esc(x)+'</button>'; });
    h += '</div>';
  }
  h += '<div class="msgs" id="askMsgs">';
  ask.turns.forEach(function(t){
    h += t.role==='user' ? '<div class="msg me"><div class="who">じぶん</div><div class="body">'+esc(t.content)+'</div></div>'
      : '<div class="msg ai"><div class="who">CLAUDE</div><div class="body">'+fmt(t.content)+'</div></div>'; });
  if(ask.busy) h += '<div class="msg ai"><div class="who">CLAUDE</div><div class="body" id="askLive">'+
    (ask.partial?fmt(ask.partial):'<span class="thinking"><i></i>考えています…</span>')+'</div></div>';
  if(ask.err) h += '<div class="msg err"><div class="body">'+esc(ask.err)+'</div></div>';
  h += '</div>';
  h += '<div class="composer"><textarea id="askInput" rows="2" placeholder="質問を入力"></textarea>'+
    '<div class="act"><span class="hint">'+(ask.busy?'回答中':'あなたのClaudeの利用枠を使います')+'</span>'+
    (ask.busy?'<button class="send" data-act="askstop" style="background:var(--bad)">停止</button>'
             :'<button class="send" data-act="asksend">送信</button>')+'</div></div></div>';
  box.innerHTML = h;
  var ta = document.getElementById('askInput');
  if(ta){ ta.value = ask.draft||'';
    ta.addEventListener('input', function(){ ask.draft = ta.value; ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px'; });
    ta.addEventListener('keydown', function(ev){ if(ev.key==='Enter'&&(ev.metaKey||ev.ctrlKey)){ ev.preventDefault(); sendAsk(); } }); }
}
function sendAsk(text){
  if(!sampleFn || ask.busy) return;
  var ta = document.getElementById('askInput');
  var msg = (text!==undefined ? text : (ta?ta.value:'')).trim();
  if(!msg) return;
  ask.turns.push({role:'user',content:msg}); ask.turns = ask.turns.slice(-10);
  ask.draft=''; ask.err=''; ask.partial=''; ask.busy = true; renderAsk();
  var lead = rules(), cx = ctxText(ask.ctx); if(cx) lead += '\n\n'+cx;
  var input = [{role:'user',content:lead}].concat(ask.turns.map(function(t){ return {role:t.role,content:t.content}; }));
  ask.ctl = new AbortController();
  sampleFn(input, { signal:ask.ctl.signal, cache:false, onText:function(u){
      ask.partial = u.text; var live = document.getElementById('askLive'); if(live) live.innerHTML = fmt(u.text); } })
  .then(function(r){ ask.turns.push({role:'assistant',content:r.text}); ask.busy=false; ask.partial=''; ask.ctl=null; renderAsk(); })
  .catch(function(e){ ask.busy=false; ask.ctl=null;
    if(e&&e.text) ask.turns.push({role:'assistant',content:e.text});
    ask.partial=''; ask.err = (e&&e.code==='cancelled')?'':askErr(e&&e.code); renderAsk(); });
}
function askErr(c){
  if(c==='not_granted'||c==='sampling_disabled') return 'Claudeへの質問が許可されていません。画面の許可ダイアログで「許可」を選ぶと使えます。';
  if(c==='rate_limited') return '短時間に聞きすぎたようです。少し時間をおいてから。';
  if(c==='session_expired') return 'ログインし直してください。';
  if(c==='prompt_too_large') return '内容が長すぎました。短く区切ってください。';
  return '答えを取得できませんでした。もう一度試してください。';
}

/* ---------- 操作 ---------- */
document.addEventListener('click', function(ev){
  var t = ev.target;
  if(!t.closest) return;
  var sayEl = t.closest('[data-say]');
  if(sayEl){ speak(sayEl.dataset.say, sayEl); return; }
  var pt = t.closest('[data-pt]');
  if(pt){ showTip(Number(pt.dataset.pt)); return; }
  var hitMark = t.closest('mark.hl');
  if(hitMark && !t.closest('[data-act]')){
    var sel = window.getSelection();
    if(sel && sel.isCollapsed){
      var rg = document.createRange(); rg.selectNodeContents(hitMark);
      sel.removeAllRanges(); sel.addRange(rg); updateSelBar(); return; }
  }
  var pw = t.closest('[data-pickw]');
  if(pw && quiz && quiz.order && !quiz.done){
    var i = Number(pw.dataset.pickw);
    quiz.order.picked.push(quiz.order.pool[i]);
    quiz.order.pool.splice(i,1); renderQuiz(); return; }
  var up = t.closest('[data-unpick]');
  if(up && quiz && quiz.order && !quiz.done){
    var j = Number(up.dataset.unpick);
    quiz.order.pool.push(quiz.order.picked[j]);
    quiz.order.picked.splice(j,1); renderQuiz(); return; }
  var pk = t.closest('[data-pick]');
  if(pk){ pick(Number(pk.dataset.pick)); return; }
  var sg = t.closest('[data-sugg]');
  if(sg){ sendAsk(sg.dataset.sugg); return; }
  var el = t.closest('[data-act]');
  if(!el) return;
  var act = el.dataset.act || '', p = act.split(':'), k = p[0], v = p.slice(1).join(':');

  if(k==='go'){ bookView=null; render(); show(v); return; }
  if(k==='mode'){ if(v!==mode){ mode=v; try{ localStorage.setItem(LS+'-mode',v); }catch(e){} chartField=null; render(); } return; }
  if(k==='book'){ bookView = v?{field:v}:null; renderBook(); show('book'); return; }
  if(k==='topic'){ bookView = {topic:v}; renderBook(); show('book'); return; }
  if(k==='read'){ if(S.read[v]) delete S.read[v]; else S.read[v]=Date.now(); scheduleSave(); renderBook(); renderHome(); return; }
  if(k==='field'){ var qs = setOf(poolBy(v));
    startQuiz(qs, (TB[v]?TB[v].short:'分野別')+' '+qs.length+'問', 'drill', {kind:'field',f:v,ex:mode}); return; }
  if(k==='topicquiz'){ var tq = setOf(QS.filter(function(q){ return q.t===v; }), 99);
    var inf = TMAP[v]; startQuiz(tq, inf?inf.t.title:'章別', 'book', {kind:'topic',f:inf?inf.f:null,ex:mode}); return; }
  if(k==='review'){ startQuiz(setOf(dueList()), '復習テスト', 'drill', {kind:'review'}); return; }
  if(k==='weak'){ startQuiz(setOf(pickWeak(SET_N*2)), '弱点つぶし', 'drill', {kind:'weak'}); return; }
  if(k==='random'){ startQuiz(setOf(pool()), modeName()+'ランダム'+SET_N+'問', 'drill', {kind:'random'}); return; }
  if(k==='mock'){ var ms = mockSet(); startQuiz(ms, modeName()+'総合テスト '+ms.length+'問', 'drill', {kind:'mock'}); return; }
  if(k==='retry'){ var ids = (quiz&&quiz.wrongIds)||[];
    var rq = ids.map(function(i){ return QMAP[i]; }).filter(Boolean);
    if(rq.length) startQuiz(shuffle(rq), '間違い直し', 'drill', {kind:'retry'}); return; }
  if(k==='ordercheck'){ orderCheck(); return; }
  if(k==='inpcheck'){ inpCheck(); return; }
  if(k==='giveup'){ giveUp(); return; }
  if(k==='unit'){ unitQuiz(); return; }
  if(k==='lang'){ setLang(v); return; }
  if(k==='hard'){ setHard(v === '1'); return; }
  if(k==='resume'){ resumeQuiz(); return; }
  if(k==='dropresume'){ S.quiz=null; scheduleSave(); renderHome(); return; }
  if(k==='cf'){ chartField = v||null; renderWeak(); return; }
  if(k==='bm'){
    var ex = S.bm.filter(function(b){ return b.topic===v; })[0];
    if(ex) S.bm = S.bm.filter(function(b){ return b.id!==ex.id; });
    else { var inf2 = TMAP[v], def = inf2?inf2.t.title:'ブックマーク';
      var nm = window.prompt('ブックマークの名前', def);
      if(nm===null) return;
      S.bm.push({id:'bm'+Date.now(), topic:v, name:(String(nm).trim()||def).slice(0,60), at:Date.now()}); }
    scheduleSave(); renderBook(); return; }
  if(k==='bmdel'){ S.bm = S.bm.filter(function(b){ return b.id!==v; }); scheduleSave(); renderBook(); return; }
  if(k==='mkclear'){ if(window.confirm('この章の線をすべて消します。よろしいですか？')){ delete S.marks[v]; scheduleSave(); renderBook(); } 
    var b3 = document.getElementById('selbar'); if(b3) b3.hidden = true; return; }
  if(k==='mkadd'||k==='mkdel'){
    var info = selInfo(), tid = bookView && bookView.topic;
    if(info && tid){
      S.marks[tid] = S.marks[tid] || {};
      var cur2 = ranges(tid, info.key);
      var next = (k==='mkadd') ? mergeRanges(cur2.concat([[info.s,info.e]])) : subRange(cur2, info.s, info.e);
      if(next.length) S.marks[tid][info.key] = next; else delete S.marks[tid][info.key];
      if(!Object.keys(S.marks[tid]).length) delete S.marks[tid];
      scheduleSave();
      var s2 = window.getSelection(); if(s2) s2.removeAllRanges();
      var bar = document.getElementById('selbar'); if(bar) bar.hidden = true;
      refreshMarks(); }
    return; }
  if(k==='ask'){ openAsk(null,null); return; }
  if(k==='askq'){ openAsk('q',v); return; }
  if(k==='askt'){ openAsk('t',v); return; }
  if(k==='askclear'){ ask.ctx=null; renderAsk(); return; }
  if(k==='asksend'){ sendAsk(); return; }
  if(k==='askstop'){ if(ask.ctl) ask.ctl.abort(); return; }
  if(k==='reset'){
    if(window.confirm(L.name+'の学習記録をすべて消去します。元に戻せません。よろしいですか？')){
      ALL[lang] = blank(); S = ALL[lang];
      scheduleSave(); render(); renderSet(); }
    return; }
});
var selTimer = null;
function queueSelBar(){ if(selTimer) clearTimeout(selTimer); selTimer = setTimeout(updateSelBar, 140); }
document.addEventListener('selectionchange', queueSelBar);
document.addEventListener('mouseup', queueSelBar);
document.addEventListener('touchend', queueSelBar);

function render(){ renderHome(); renderBook(); renderDrill(); renderWeak(); renderAsk(); }
loadLocal();

render();
show('home');

})();
