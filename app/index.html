<title>FP3級 合格ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f6f7f5; --card:#ffffff; --sunk:#eceee9;
  --ink:#1b211e; --ink-2:#4a544e; --ink-3:#7c867f;
  --line:#dfe3dd; --line-2:#c9cfc7;
  --accent:#0f6b4f; --accent-soft:#e2f0e9; --accent-ink:#0b5540;
  --good:#1d7a4c; --good-soft:#e3f2e8;
  --bad:#b3341f; --bad-soft:#fbe7e2;
  --warn:#8a6100; --warn-soft:#fbf0d8;
  --f1:#2f6f9f; --f2:#8a4f9e; --f3:#0f7a6b; --f4:#b2632a; --f5:#4a6a2e; --f6:#a1444f;
  --mark:#d9a520; --mark-soft:#fdf0c9; --mark-ink:#7a5a00;
  --r:14px; --r-s:9px;
  --shadow:0 1px 2px rgba(20,30,25,.06), 0 4px 14px rgba(20,30,25,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#121614; --card:#1b211e; --sunk:#232a26;
  --ink:#e9ede9; --ink-2:#aeb8b1; --ink-3:#7f8a83;
  --line:#2c3531; --line-2:#3c4740;
  --accent:#4fbf95; --accent-soft:#183329; --accent-ink:#7ad3b0;
  --good:#54c084; --good-soft:#15301f;
  --bad:#f0806a; --bad-soft:#341a14;
  --warn:#e0b060; --warn-soft:#332809;
  --f1:#6ba8d6; --f2:#c08ed4; --f3:#4fc2b0; --f4:#e0965a; --f5:#8fbf5e; --f6:#e08a95;
  --mark:#c9a33a; --mark-soft:#40350f; --mark-ink:#e8cd7a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --paper:#121614; --card:#1b211e; --sunk:#232a26;
  --ink:#e9ede9; --ink-2:#aeb8b1; --ink-3:#7f8a83;
  --line:#2c3531; --line-2:#3c4740;
  --accent:#4fbf95; --accent-soft:#183329; --accent-ink:#7ad3b0;
  --good:#54c084; --good-soft:#15301f;
  --bad:#f0806a; --bad-soft:#341a14;
  --warn:#e0b060; --warn-soft:#332809;
  --f1:#6ba8d6; --f2:#c08ed4; --f3:#4fc2b0; --f4:#e0965a; --f5:#8fbf5e; --f6:#e08a95;
  --mark:#c9a33a; --mark-soft:#40350f; --mark-ink:#e8cd7a;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic Medium","Meiryo",system-ui,sans-serif;
  font-size:15px; line-height:1.75; -webkit-text-size-adjust:100%;
}
h1,h2,h3,.disp{font-family:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif; text-wrap:balance}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
button{font:inherit; color:inherit; cursor:pointer;
  -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
/* 教科書の本文だけは、なぞって線を引けるように選択を許す */
.doc, .doc *{-webkit-user-select:text; user-select:text}
.doc button, .tools button, #selbar button{-webkit-user-select:none; user-select:none}
a{color:var(--accent-ink)}

/* ---- shell ---- */
#top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
#top .bar{max-width:720px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:10px}
#top .mark{
  width:26px; height:26px; border-radius:7px; background:var(--accent); color:#fff;
  display:grid; place-items:center; font-size:11px; font-weight:700; letter-spacing:.02em; flex:none;
}
#top h1{margin:0; font-size:15px; font-weight:700; letter-spacing:.01em}
#top .spacer{flex:1}
.iconbtn{
  background:none; border:1px solid var(--line-2); border-radius:8px;
  width:32px; height:32px; display:grid; place-items:center; font-size:14px; flex:none;
}
main{max-width:720px; margin:0 auto; padding:16px 16px 104px}
.view[hidden]{display:none!important}

/* ---- bottom nav ---- */
#nav{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
}
#nav .row{max-width:720px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); gap:3px}
#nav button{
  background:none; border:0; border-radius:10px; padding:7px 2px 5px;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10.5px; color:var(--ink-3); letter-spacing:.02em;
}
#nav button .ic{font-size:17px; line-height:1}
#nav button[aria-current="true"]{color:var(--accent-ink); background:var(--accent-soft)}

/* ---- primitives ---- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.eyebrow{font-size:11px; letter-spacing:.09em; color:var(--ink-3); font-weight:700; margin:0 0 6px}
.stack{display:flex; flex-direction:column; gap:12px}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px; line-height:1.6}
.btn{
  border:1px solid var(--line-2); background:var(--card); border-radius:10px;
  padding:11px 14px; font-weight:700; font-size:14px; width:100%; text-align:center;
}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45}
.btnrow{display:flex; gap:8px}
.btnrow .btn{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
  padding:2px 7px; border-radius:99px; letter-spacing:.03em; white-space:nowrap;
}
.chip.f{color:#fff}
.chip.tag{background:var(--sunk); color:var(--ink-2)}
.chip.hot{background:var(--bad-soft); color:var(--bad)}
.chip.law{background:var(--warn-soft); color:var(--warn)}
.bar{height:6px; border-radius:99px; background:var(--sunk); overflow:hidden}
.bar i{display:block; height:100%; border-radius:99px; background:var(--accent)}

/* ---- home ---- */
.hero{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:18px 16px; box-shadow:var(--shadow);
}
.count{display:flex; align-items:baseline; gap:10px; margin:2px 0 4px}
.count b{font-size:46px; line-height:1; font-weight:600; letter-spacing:-.02em}
.count span{font-size:13px; color:var(--ink-2)}
.metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border-radius:var(--r-s); overflow:hidden; margin-top:14px}
.metrics div{background:var(--card); padding:10px 8px; text-align:center}
.metrics b{display:block; font-size:19px; font-weight:600; letter-spacing:-.01em}
.metrics small{display:block; font-size:10.5px; color:var(--ink-3); margin-top:1px}
.todo{display:flex; align-items:center; gap:11px; padding:12px 0; border-top:1px solid var(--line)}
.todo:first-of-type{border-top:0}
.todo .t{flex:1; min-width:0}
.todo .t b{display:block; font-size:14px; font-weight:700}
.todo .t small{display:block; font-size:12px; color:var(--ink-2); margin-top:1px}
.todo .go{border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent-ink);
  border-radius:8px; padding:7px 12px; font-size:12.5px; font-weight:700; flex:none}

/* ---- lists ---- */
.rowbtn{
  width:100%; display:flex; align-items:center; gap:11px; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r-s);
  padding:12px 13px; margin-top:8px;
}
.rowbtn .lead{width:5px; align-self:stretch; border-radius:99px; flex:none}
.rowbtn .body{flex:1; min-width:0}
.rowbtn .body b{display:block; font-size:14px; font-weight:700}
.rowbtn .body small{display:block; font-size:11.5px; color:var(--ink-3); margin-top:2px}
.rowbtn .end{flex:none; font-size:12px; color:var(--ink-3); text-align:right}
.rowbtn .end .pct{font-weight:700; font-size:14px; color:var(--ink)}
.done{color:var(--good)}

/* ---- textbook ---- */
.doc{font-size:15px; line-height:1.88; --fc:var(--accent)}
.doc h3{
  font-size:19px; margin:4px 0 18px; font-weight:700; letter-spacing:.01em;
  padding-left:12px; border-left:4px solid var(--fc); line-height:1.5;
}
.doc p{margin:0 0 17px}
.doc p.lead{
  font-size:15px; margin:0 0 20px; padding:13px 15px; border-radius:10px;
  background:var(--sunk);
  background:color-mix(in srgb, var(--fc) 8%, var(--sunk));
  border-left:3px solid var(--fc);
}
.doc ul{margin:0 0 20px; padding:0; list-style:none}
.doc li{position:relative; padding-left:17px; margin:0 0 12px}
.doc li::before{
  content:""; position:absolute; left:2px; top:.78em;
  width:6px; height:6px; border-radius:50%; background:var(--fc); opacity:.7;
}
.doc li li{margin:0 0 6px}
.doc li > b:first-child{color:var(--fc)}
.doc u{
  text-decoration:none; padding:0 2px; border-radius:2px;
  background:linear-gradient(transparent 58%, color-mix(in srgb, var(--fc) 24%, transparent) 0);
}
.doc b{font-weight:700}
.doc sup{font-size:.7em}
.doc .box + .box{margin-top:-4px}
.tablewrap{overflow-x:auto; margin:0 0 20px; border:1px solid var(--line); border-radius:var(--r-s)}
.doc table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:340px; line-height:1.7}
.doc th,.doc td{border-bottom:1px solid var(--line); padding:10px 12px; text-align:left; vertical-align:top}
.doc th{
  background:var(--sunk);
  background:color-mix(in srgb, var(--fc) 11%, var(--sunk));
  color:var(--fc); font-weight:700; white-space:nowrap; font-size:11.5px; letter-spacing:.03em;
}
.doc tbody tr:nth-child(even) td{background:color-mix(in srgb, var(--fc) 4%, transparent)}
.doc tr:last-child td{border-bottom:0}
.box{border-radius:var(--r-s); padding:14px 16px; margin:0 0 20px; font-size:14px; line-height:1.82}
.box .lab{font-size:10.5px; font-weight:700; letter-spacing:.09em; display:block; margin-bottom:7px}
.box.ex{background:var(--sunk); border-left:3px solid var(--ink-3)}
.box.ex .lab{color:var(--ink-3)}
.box.ex .q{font-weight:700; margin-bottom:9px; padding-bottom:9px; border-bottom:1px dashed var(--line-2)}
.box.key{background:var(--accent-soft); border-left:3px solid var(--accent)}
.box.key .lab{color:var(--accent-ink)}
.box.key ul{margin:0; padding:0; list-style:none}
.box.key li{margin:0 0 7px; padding-left:15px; position:relative}
.box.key li::before{content:""; position:absolute; left:1px; top:.8em; width:5px; height:5px; border-radius:1px; background:var(--accent); opacity:.8}
.box.warn{background:var(--warn-soft); border-left:3px solid var(--warn)}
.box.warn .lab{color:var(--warn)}
figure.fig{
  margin:0 0 22px; background:var(--sunk); border-radius:var(--r-s);
  padding:14px 12px 11px; overflow-x:auto;
}
figure.fig svg{display:block; width:100%; max-width:100%; height:auto; color:var(--ink)}
figure.fig .fc-s{stroke:var(--fc)}
figure.fig .fc-f{fill:var(--fc)}
figure.fig .ac-s{stroke:var(--accent)}
figure.fig .ac-f{fill:var(--accent)}
figure.fig .ng-s{stroke:var(--bad)}
figure.fig .ng-f{fill:var(--bad)}
figure.fig .mk-f{fill:var(--mark)}
figure.fig .p1{fill:var(--f3)}
figure.fig .p2{fill:var(--f2)}
figure.fig .p3{fill:var(--f4)}
figure.fig .dim{opacity:.55}
figure.fig figcaption{
  margin-top:9px; font-size:12px; line-height:1.6; color:var(--ink-2); text-align:left;
}
.steps{counter-reset:st; margin:0 0 22px; display:flex; flex-direction:column; gap:9px}
.steps .st{display:flex; gap:11px; align-items:flex-start}
.steps .st .n{
  flex:none; width:24px; height:24px; border-radius:50%; background:var(--fc);
  color:#fff; font-size:12px; font-weight:700; display:grid; place-items:center; margin-top:2px;
}
.steps .st .c{flex:1; min-width:0}
.steps .st .c b{display:block; font-size:14px; font-weight:700}
.steps .st .c span{display:block; font-size:13.5px; color:var(--ink-2); line-height:1.7; margin-top:1px}
.cmp{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 22px}
@media (max-width:420px){ .cmp{grid-template-columns:1fr} }
.cmp .side{border:1px solid var(--line); border-radius:var(--r-s); padding:11px 12px; background:var(--card)}
.cmp .side h4{margin:0 0 7px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px}
.cmp .side h4 .dot{width:8px; height:8px; border-radius:50%; flex:none}
.cmp .side ul{margin:0; padding-left:1.05em}
.cmp .side li{font-size:13px; line-height:1.65; margin:0 0 5px}
.cmp .a h4 .dot{background:var(--fc)}
.cmp .b h4 .dot{background:var(--f4)}

/* ---- quiz ---- */
.qhead{display:flex; align-items:center; gap:8px; margin-bottom:10px}
.qhead .prog{flex:1}
.qhead .cnt{font-size:12px; color:var(--ink-2); flex:none}
.clock{flex:none; font-size:12px; font-weight:700; color:var(--ink-3);
  background:var(--sunk); border-radius:99px; padding:3px 9px; min-width:48px; text-align:center}
.clock.warn{background:var(--warn-soft); color:var(--warn)}
.clock.over{background:var(--bad-soft); color:var(--bad)}
.star{flex:none; width:32px; height:32px; border-radius:9px; border:1px solid var(--line-2);
  background:var(--card); color:var(--ink-3); font-size:15px; line-height:1; display:grid; place-items:center}
.star.on{background:var(--mark-soft); border-color:var(--mark); color:var(--mark-ink)}
.qbmrow{display:flex; align-items:flex-start; gap:9px; padding:11px 0; border-top:1px solid var(--line)}
.qbmrow:first-of-type{border-top:0}
.qbmrow .b{flex:1; min-width:0}
.qtime{margin-left:auto; font-size:11.5px; font-weight:700; color:var(--ink-3);
  background:var(--card); border-radius:99px; padding:2px 9px;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.qtime.slow{color:var(--bad)}
.rank{display:flex; align-items:center; gap:9px; padding:9px 0; border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank .pos{flex:none; width:20px; font-size:12px; font-weight:700; color:var(--ink-3); text-align:right;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.rank .gr{flex:none; width:24px; height:24px; border-radius:7px; display:grid; place-items:center;
  font-size:12px; font-weight:700; color:#fff}
.rank .nm{flex:1; min-width:0}
.rank .nm b{display:block; font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.rank .nm small{display:block; font-size:11px; color:var(--ink-3); margin-top:1px;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.rank .sc{flex:none; width:38px; text-align:right; font-size:15px; font-weight:700;
  font-family:"IBM Plex Mono",ui-monospace,monospace}
.pacebar{display:flex; gap:1px; background:var(--line); border-radius:var(--r-s); overflow:hidden; margin-top:12px}
.pacebar div{flex:1; background:var(--card); padding:9px 4px; text-align:center}
.pacebar b{display:block; font-size:16px; font-weight:600; font-family:"IBM Plex Mono",ui-monospace,monospace}
.pacebar small{display:block; font-size:10px; color:var(--ink-3); margin-top:1px}
.qctx{
  background:var(--sunk); border-left:3px solid var(--ink-3); border-radius:var(--r-s);
  padding:12px 14px; margin:8px 0 14px; font-size:13.5px; line-height:1.75;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
}
.qctx table{border-collapse:collapse; width:100%; margin:8px 0 2px; font-size:12.5px; table-layout:fixed}
.qctx th,.qctx td{
  border:1px solid var(--line-2); padding:6px 8px; text-align:left; vertical-align:top;
  word-break:break-word; overflow-wrap:anywhere;
}
.qctx th{background:var(--card); font-weight:700}
.qctx tr > th:first-child:not(:only-child){width:40%}
.qctx tr > th:first-child:nth-last-child(3) ~ td,
.qctx tr > th:first-child:nth-last-child(3){width:auto}
.qtext{font-size:16px; line-height:1.8; font-weight:500; margin:6px 0 16px}
.opt{
  width:100%; text-align:left; background:var(--card); border:1.5px solid var(--line-2);
  border-radius:11px; padding:13px 14px; margin-top:9px; font-size:14.5px; line-height:1.6;
  display:flex; gap:10px; align-items:flex-start;
}
.opt .mk{
  flex:none; width:23px; height:23px; border-radius:50%; border:1.5px solid var(--line-2);
  display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--ink-2); margin-top:1px;
}
.opt.ok{border-color:var(--good); background:var(--good-soft)}
.opt.ok .mk{border-color:var(--good); background:var(--good); color:#fff}
.opt.ng{border-color:var(--bad); background:var(--bad-soft)}
.opt.ng .mk{border-color:var(--bad); background:var(--bad); color:#fff}
.opt:disabled{opacity:1}
.verdict{margin-top:16px; border-radius:var(--r-s); padding:13px 14px; font-size:14px}
.verdict.ok{background:var(--good-soft); border-left:3px solid var(--good)}
.verdict.ng{background:var(--bad-soft); border-left:3px solid var(--bad)}
.verdict .v{font-weight:700; margin-bottom:5px; display:flex; align-items:center; gap:6px}
.verdict.ok .v{color:var(--good)}
.verdict.ng .v{color:var(--bad)}
.verdict .lnk{margin-top:9px}
.verdict .lnk button{background:none; border:0; padding:0; font-size:12.5px; font-weight:700; color:var(--accent-ink); text-decoration:underline}
.sticky-act{position:sticky; bottom:calc(76px + env(safe-area-inset-bottom,0px)); margin-top:16px}

/* ---- result ---- */
.score{text-align:center; padding:8px 0 4px}
.score b{display:block; font-size:52px; font-weight:600; line-height:1; letter-spacing:-.02em}
.score .of{font-size:14px; color:var(--ink-2); margin-top:6px}
.score .judge{display:inline-block; margin-top:12px; padding:5px 14px; border-radius:99px; font-size:13px; font-weight:700}
.judge.pass{background:var(--good-soft); color:var(--good)}
.judge.fail{background:var(--bad-soft); color:var(--bad)}

/* ---- chart ---- */
.seg{display:flex; gap:0; background:var(--sunk); border-radius:10px; padding:3px; margin:0 0 14px}
.seg button{
  flex:1; border:0; background:none; border-radius:8px; padding:8px 4px;
  font-size:13px; font-weight:700; color:var(--ink-2);
}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.fchips{display:flex; gap:6px; overflow-x:auto; padding:0 0 3px; margin:0 0 12px; -webkit-overflow-scrolling:touch}
.fchips button{
  flex:none; border:1px solid var(--line-2); background:var(--card); border-radius:99px;
  padding:6px 12px; font-size:12px; font-weight:700; color:var(--ink-2); white-space:nowrap;
}
.fchips button[aria-pressed="true"]{background:var(--cc,var(--accent)); border-color:var(--cc,var(--accent)); color:#fff}
.chartwrap{position:relative; margin:0 0 4px}
.chartwrap svg{display:block; width:100%; height:auto; overflow:visible}
.chartwrap .grid{stroke:var(--line); stroke-width:1}
.chartwrap .pass{stroke:var(--ink-3); stroke-width:1.2; stroke-dasharray:4 4}
.chartwrap .ln{fill:none; stroke:var(--cc,var(--accent)); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.chartwrap .pt{fill:var(--card); stroke:var(--cc,var(--accent)); stroke-width:2}
.chartwrap .pt.last{fill:var(--cc,var(--accent))}
.chartwrap .raw{fill:var(--cc,var(--accent)); opacity:.3}
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:11.5px; color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{display:inline-block; flex:none}
.legend .k-ln{width:16px; height:2px; background:var(--cc,var(--accent)); border-radius:2px}
.legend .k-raw{width:7px; height:7px; border-radius:50%; background:var(--cc,var(--accent)); opacity:.3}

<script>
(function(){
"use strict";
var TB = window.FP_TEXTBOOK || {};
var QS = window.FP_QUESTIONS || [];
var FIELDS = ['f1','f2','f3','f4','f5','f6'];
/* sec は本番のペース。学科は60問60分＝1問60秒、実技は20問60分＝1問180秒 */
var EXAMS = { g:{key:'g', name:'学科', mock:60, per:10, sec:60}, j:{key:'j', name:'実技', mock:20, per:4, sec:180} };
var MAXMS = 180000; /* これを超えたら「手を止めていた」とみなして時間は記録しない */
var examScope = 'g';
function exOf(q){ return q.ex === 'j' ? 'j' : 'g'; }
var QBY = {};   // QBY[scope][field]
function rebuildPools(){
  QBY = { g:{}, j:{} };
  FIELDS.forEach(function(f){ QBY.g[f] = []; QBY.j[f] = []; });
  QS.forEach(function(q){ var e = exOf(q); if(QBY[e][q.f]) QBY[e][q.f].push(q); });
}
function pool(scope){
  scope = scope || examScope;
  var out = [];
  FIELDS.forEach(function(f){ out = out.concat(QBY[scope][f] || []); });
  return out;
}
function poolBy(f, scope){ return (QBY[scope || examScope][f]) || []; }
function scopeName(){ return EXAMS[examScope].name; }
var QMAP = {}; QS.forEach(function(q){ QMAP[q.id]=q; });
var TMAP = {}; FIELDS.forEach(function(f){ if(TB[f]) TB[f].topics.forEach(function(t){ TMAP[t.id]={t:t,f:f}; }); });
var ALLTOPICS = 0; FIELDS.forEach(function(f){ if(TB[f]) ALLTOPICS += TB[f].topics.length; });
var DAY = 86400000;
var INTERVALS = [1,2,4,8,16];
var LS = 'fp3-drill-v1';

/* ---------- state ---------- */
var S = { stats:{}, read:{}, sessions:[], exam:'2026-10-02', gen:[], marks:{}, bm:[], qbm:[], quiz:null };
var db = null, dbDoc = null, saveTimer = null, dirty = false;
var sampleFn = null;

function loadLocal(){
  try{ var raw = localStorage.getItem(LS); if(raw){ var o = JSON.parse(raw); if(o && typeof o==='object') merge(o); } }catch(e){}
}
function merge(o){
  if(o.stats) for(var k in o.stats){ var a=S.stats[k], b=o.stats[k];
    if(!a || (b && (b.t||0) > (a.t||0))) S.stats[k]=b; }
  if(o.read) for(var k2 in o.read){ if(!S.read[k2] || o.read[k2] > S.read[k2]) S.read[k2]=o.read[k2]; }
  if(o.sessions && o.sessions.length){
    var seen={}; var all = S.sessions.concat(o.sessions).filter(function(s){
      if(!s || !s.at || seen[s.at]) return false; seen[s.at]=1; return true; });
    all.sort(function(a,b){return b.at-a.at}); S.sessions = all.slice(0,60);
  }
  if(o.exam) S.exam = o.exam;
  if(o.marks) for(var k3 in o.marks){
    S.marks[k3] = S.marks[k3] || {};
    for(var k4 in o.marks[k3]) S.marks[k3][k4] = o.marks[k3][k4];
  }
  if(o.bm && o.bm.length){
    var hb = {}; S.bm.forEach(function(b){ hb[b.id]=1; });
    o.bm.forEach(function(b){ if(b && b.id && !hb[b.id]){ hb[b.id]=1; S.bm.push(b); } });
  }
  if(o.quiz && !S.quiz) S.quiz = o.quiz;
  if(o.qbm && o.qbm.length){
    var hq = {}; S.qbm.forEach(function(x){ hq[x.id]=1; });
    o.qbm.forEach(function(x){ if(x && x.id && !hq[x.id]){ hq[x.id]=1; S.qbm.push(x); } });
  }
  if(o.gen && o.gen.length){
    var have = {}; S.gen.forEach(function(g){ have[g.id]=1; });
    o.gen.forEach(function(g){ if(g && g.id && !have[g.id]){ have[g.id]=1; S.gen.push(g); } });
    S.gen = S.gen.slice(-150);
  }
}
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
var saveState = 'saved', saveFlash = null;
function setSave(st){
  saveState = st;
  var el2 = document.getElementById('saveDot');
  if(!el2) return;
  el2.className = 'savedot ' + st;
  el2.querySelector('.txt').textContent = st==='saving' ? '保存中' : '保存済み';
}
function scheduleSave(){
  dirty = true; saveLocal();
  setSave('saving');
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    pushRemote();
    if(!dbDoc){ if(saveFlash) clearTimeout(saveFlash); saveFlash = setTimeout(function(){ setSave('saved'); }, 250); }
  }, 1200);
}
var pushing = false;
function pushRemote(){
  if(!dbDoc || pushing || !dirty) return;
  pushing = true; dirty = false;
  var payload = { stats:S.stats, read:S.read, sessions:S.sessions.slice(0,60), exam:S.exam, gen:S.gen.slice(-150), marks:S.marks, bm:S.bm.slice(-200), qbm:S.qbm.slice(-300), quiz:S.quiz, at:Date.now() };
  dbDoc.set(payload).then(function(){
    pushing=false;
    if(dirty) pushRemote(); else setSave('saved');
  }).catch(function(){ pushing=false; setSave('saved'); });
}
function initSample(){
  if(!window.claude || !window.claude.use) return;
  window.claude.use('sample').then(function(fn){
    if(typeof fn === 'function'){ sampleFn = fn; render(); renderAsk(); }
  }).catch(function(){});
}
function initDb(){
  if(!window.claude || !window.claude.use) return;
  window.claude.use('db').then(function(d){
    if(!d) return;
    db = d; dbDoc = d.doc('progress/main');
    return dbDoc.get().then(function(snap){
      if(snap && snap.exists){ var data = snap.data()||{}; merge(data); registerGen(); saveLocal(); render(); }
      if(dirty) pushRemote();
    });
  }).catch(function(){});
}
window.addEventListener('pagehide', function(){ saveLocal(); if(dirty) pushRemote(); });

/* ---------- spaced repetition ---------- */
function addQuestions(list){
  list.forEach(function(q){
    if(QMAP[q.id]) return;
    QS.push(q); QMAP[q.id] = q;
    var e = exOf(q);
    if(QBY[e] && QBY[e][q.f]) QBY[e][q.f].push(q);
  });
}
function registerGen(){ addQuestions(S.gen.filter(function(g){ return g && g.id; })); }

function stat(id){ return S.stats[id] || null; }
function dueAt(id){
  var st = stat(id);
  if(!st) return 0;
  var iv = INTERVALS[Math.min(st.st||0, INTERVALS.length-1)];
  return (st.t||0) + iv*DAY;
}
function isDue(id){ return dueAt(id) <= Date.now(); }
function answered(id){ return !!stat(id); }
function accuracy(list){
  var n=0, c=0;
  list.forEach(function(q){ var st=stat(q.id); if(st){ n+=st.n||0; c+=(st.n||0)-(st.w||0); } });
  return n ? Math.round(c/n*100) : null;
}
function record(id, correct, ms){
  var st = S.stats[id] || {n:0,w:0,st:0,t:0};
  st.n = (st.n||0)+1;
  if(correct){ st.st = (st.st||0)+1; } else { st.w = (st.w||0)+1; st.st = 0; }
  st.t = Date.now();
  if(ms > 0 && ms <= MAXMS){
    /* 解答にかかった時間の移動平均。mn は時間を測れた回数 */
    var mn = (st.mn||0) + 1;
    st.ms = st.ms ? Math.round((st.ms*(mn-1) + ms)/mn) : ms;
    st.mn = mn;
  }
  S.stats[id] = st;
  scheduleSave();
}
/* 1問あたりの平均秒。測れていなければ null */
function avgSec(q){ var st = stat(q.id); return (st && st.ms) ? st.ms/1000 : null; }
function paceOf(list){
  var tot = 0, n = 0;
  list.forEach(function(q){ var v = avgSec(q); if(v !== null){ tot += v; n++; } });
  return n ? {sec: tot/n, n: n} : null;
}
function fmtSec(v){
  if(v === null || v === undefined) return '—';
  return v >= 60 ? Math.floor(v/60)+'分'+String(Math.round(v%60)).padStart(2,'0')+'秒' : (Math.round(v*10)/10)+'秒';
}
/* 速度点：本番ペースちょうどで100点。速ければ頭打ちの100、遅いほど下がる */
function speedScore(sec, ex){
  if(sec === null || !sec) return null;
  var target = EXAMS[ex || examScope].sec;
  return Math.max(0, Math.min(100, Math.round(target/sec*100)));
}
/* 問題ごとのブックマーク */
function qbmOn(id){ return S.qbm.some(function(x){ return x.id === id; }); }
function toggleQbm(id){
  if(qbmOn(id)) S.qbm = S.qbm.filter(function(x){ return x.id !== id; });
  else S.qbm.push({id:id, at:Date.now()});
  scheduleSave();
}
function qbmList(scope){
  return S.qbm.slice().reverse()
    .map(function(x){ return QMAP[x.id]; })
    .filter(function(q){ return q && (!scope || exOf(q) === scope); });
}
function starBtn(id){
  var on = qbmOn(id);
  return '<button class="star'+(on?' on':'')+'" data-act="qbm:'+id+'" aria-pressed="'+on+'" '+
    'aria-label="'+(on?'ブックマークを外す':'あとで見直す')+'">'+(on?'★':'☆')+'</button>';
}
function gradeOf(score){
  if(score === null) return {g:'—', c:'var(--ink-3)'};
  if(score >= 90) return {g:'S', c:'var(--good)'};
  if(score >= 80) return {g:'A', c:'var(--accent)'};
  if(score >= 70) return {g:'B', c:'var(--f1)'};
  if(score >= 60) return {g:'C', c:'var(--warn)'};
  return {g:'D', c:'var(--bad)'};
}
function weakList(){
  return pool().filter(function(q){ var st=stat(q.id); return st && st.w>0; })
    .sort(function(a,b){
      var A=stat(a.id), B=stat(b.id);
      var ra = A.w/A.n, rb = B.w/B.n;
      if(rb!==ra) return rb-ra;
      return B.w-A.w;
    });
}
function dueList(){
  var seen = pool().filter(function(q){ return answered(q.id) && isDue(q.id); });
  seen.sort(function(a,b){ return dueAt(a.id)-dueAt(b.id); });
  return seen;
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* 問題文・解説の中の簡単な強調タグだけを生かす。それ以外はすべて無害化する */
function rich(s){
  return esc(s).replace(/&lt;(\/?)(b|u|i|em|strong|small|br)&gt;/gi, '<$1$2>');
}
function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d; }
function fieldChip(f){
  var t = TB[f]; if(!t) return '';
  return '<span class="chip f" style="background:var(--'+f+')">'+esc(t.short)+'</span>';
}
function daysLeft(){
  if(!S.exam) return null;
  var d = new Date(S.exam+'T00:00:00');
  if(isNaN(d)) return null;
  var now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/DAY);
}
function shuffle(a){
  a = a.slice();
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

function nextUnread(){
  for(var i=0;i<FIELDS.length;i++){
    var f = FIELDS[i]; if(!TB[f]) continue;
    for(var j=0;j<TB[f].topics.length;j++){
      var t = TB[f].topics[j];
      if(!S.read[t.id]) return {f:f, t:t};
    }
  }
  return null;
}

function tagChips(t){

    var cls = tg==='法改正' ? 'law' : (tg.indexOf('頻出')>=0 ? 'hot' : 'tag');

  }).join('');
}
function mk(tid, key){ return ' data-mk="'+key+'"'; }
function mkc(tid, key, cls){ return ' data-mk="'+key+'" class="'+cls+'"'; }

function mergeRanges(arr){
  arr = (arr||[]).filter(function(r){ return r && r[1]>r[0]; })
        .sort(function(a,b){ return a[0]-b[0]; });
  var out = [];
  arr.forEach(function(r){
    var last = out[out.length-1];
    if(last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
    else out.push([r[0], r[1]]);
  });
  return out;
}
function subRange(arr, s0, e0){
  var out = [];
  (arr||[]).forEach(function(r){
    if(r[1] <= s0 || r[0] >= e0){ out.push(r); return; }
    if(r[0] < s0) out.push([r[0], s0]);
    if(r[1] > e0) out.push([e0, r[1]]);
  });
  return out;
}
function ranges(tid, key){
  var m = S.marks[tid] && S.marks[tid][key];
  if(!m) return [];
  if(m === 1) return [[0, (markLine(tid,key)||'').length]];
  return Array.isArray(m) ? m : [];
}
function wrapRange(el, s0, e0){
  var w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null);
  var nodes = [], pos = 0, n;
  while((n = w.nextNode())){ var len = n.nodeValue.length; nodes.push({n:n, s:pos, e:pos+len}); pos += len; }
  for(var i = nodes.length-1; i >= 0; i--){
    var it = nodes[i];
    if(it.e <= s0 || it.s >= e0) continue;
    if(it.n.parentNode && it.n.parentNode.nodeName === 'MARK') continue;
    var a = Math.max(s0, it.s) - it.s, b = Math.min(e0, it.e) - it.s;
    if(b <= a) continue;
    var node = it.n;
    node.splitText(b);
    var target = a > 0 ? node.splitText(a) : node;
    var mrk = document.createElement('mark');
    mrk.className = 'hl';
    target.parentNode.replaceChild(mrk, target);
    mrk.appendChild(target);
  }
}
function applyMarks(root, tid){
  var m = S.marks[tid]; if(!m || !root) return;
  Array.prototype.forEach.call(root.querySelectorAll('[data-mk]'), function(el2){
    var rs = ranges(tid, el2.dataset.mk);
    rs.forEach(function(r){ wrapRange(el2, r[0], r[1]); });
  });
}
function clearWraps(root){
  if(!root) return;
  Array.prototype.forEach.call(root.querySelectorAll('mark.hl'), function(m){
    var par = m.parentNode;
    while(m.firstChild) par.insertBefore(m.firstChild, m);
    par.removeChild(m);
    par.normalize();
  });
}
function refreshMarks(){
  var doc = document.querySelector('#v-book .doc');
  if(!doc) return;
  clearWraps(doc);
  var tid = bookView && bookView.topic;
  if(tid) applyMarks(doc, tid);
  var cnt = document.getElementById('mkCount');
  if(cnt && tid){
    var n = markCount(tid);
    if(n) cnt.textContent = '線を消す（'+n+'）'; else cnt.hidden = true;
  }
}
function markCount(tid){
  var m = S.marks[tid]; if(!m) return 0;
  var n = 0;
  Object.keys(m).forEach(function(k){ n += ranges(tid,k).length; });
  return n;
}
function selInfo(){
  var sel = window.getSelection();
  if(!sel || sel.isCollapsed || !sel.rangeCount) return null;
  var r = sel.getRangeAt(0);
  if(!r.toString().trim()) return null;
  var host = r.commonAncestorContainer;
  if(host.nodeType === 3) host = host.parentNode;
  if(!host || !host.closest) return null;
  host = host.closest('[data-mk]');
  var bookEl = document.getElementById('v-book');
  if(!host || !bookEl || bookEl.hidden || !bookEl.contains(host)) return null;
  var pre = document.createRange();
  pre.selectNodeContents(host);
  pre.setEnd(r.startContainer, r.startOffset);
  var s0 = pre.toString().length;
  var e0 = s0 + r.toString().length;
  if(e0 <= s0) return null;
  return { key: host.dataset.mk, s: s0, e: e0 };
}
function updateSelBar(){
  var bar = document.getElementById('selbar');
  if(!bar) return;
  var info = selInfo();
  if(!info){ bar.hidden = true; return; }
  var tid = bookView && bookView.topic;
  if(!tid){ bar.hidden = true; return; }
  var has = ranges(tid, info.key).some(function(r){ return r[0] < info.e && r[1] > info.s; });
  bar.querySelector('.mkdel').hidden = !has;
  bar.hidden = false;
}
function renderBlocks(blocks, tid){
  tid = tid || '';
  return (blocks||[]).map(function(b, bi){
    var k = 'b'+bi;
    if(b.t==='p') return '<p'+mk(tid,k)+(bi===0?' class="lead"':'')+'>'+b.x+'</p>';
    if(b.t==='ul') return '<ul>'+b.x.map(function(li,li2){
        return '<li'+mk(tid,k+'.'+li2)+'>'+li+'</li>'; }).join('')+'</ul>';
    if(b.t==='table'){
      var s2 = '<div class="tablewrap"><table><thead><tr>'+
        b.head.map(function(h){return '<th>'+h+'</th>'}).join('')+'</tr></thead><tbody>';
      s2 += b.rows.map(function(r,ri){
        return '<tr'+mk(tid,k+'.'+ri)+'>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'; }).join('');
      return s2+'</tbody></table></div>';
    }
    if(b.t==='ex') return '<div'+mkc(tid,k,'box ex')+'><span class="lab">例</span><div class="q">'+b.q+'</div><div>'+b.a+'</div></div>';
    if(b.t==='key') return '<div class="box key"><span class="lab">暗記ポイント</span><ul>'+
      (Array.isArray(b.x)?b.x:[b.x]).map(function(x,xi){
        return '<li'+mk(tid,k+'.'+xi)+'>'+x+'</li>'; }).join('')+'</ul></div>';
    if(b.t==='warn') return '<div'+mkc(tid,k,'box warn')+'><span class="lab">注意</span><div>'+b.x+'</div></div>';
    if(b.t==='fig') return '<figure class="fig">'+b.svg+
      (b.cap ? '<figcaption'+mk(tid,k)+'>'+b.cap+'</figcaption>' : '')+'</figure>';
    if(b.t==='steps') return '<div class="steps">'+b.x.map(function(st,si){
        return '<div class="st"><span class="n">'+(si+1)+'</span><span class="c"'+mk(tid,k+'.'+si)+'>'+
          '<b>'+st.t+'</b>'+(st.d?'<span>'+st.d+'</span>':'')+'</span></div>'; }).join('')+'</div>';
    if(b.t==='cmp') return '<div class="cmp">'+['a','b'].map(function(side,sidx){
        var d = b[side]; if(!d) return '';
        return '<div class="side '+side+'"><h4><span class="dot"></span>'+d.t+'</h4><ul>'+
          d.x.map(function(li,li3){ return '<li'+mk(tid,k+'.'+(sidx*50+li3))+'>'+li+'</li>'; }).join('')+
          '</ul></div>'; }).join('')+'</div>';
    return '';
  }).join('');
}
function markLine(tid, key){
  var info = TMAP[tid]; if(!info) return '';
  var m = key.split('.'), bi = Number(m[0].slice(1)), si = m.length>1 ? Number(m[1]) : null;
  var b = info.t.blocks && info.t.blocks[bi]; if(!b) return '';
  if(b.t==='p') return strip(b.x);
  if(b.t==='ul') return si!==null ? strip(b.x[si]||'') : '';
  if(b.t==='key'){ var arr = Array.isArray(b.x)?b.x:[b.x]; return si!==null ? strip(arr[si]||'') : ''; }
  if(b.t==='table'){ var r = b.rows[si]; return r ? r.map(strip).join(' / ') : ''; }
  if(b.t==='ex') return strip(b.q) + ' → ' + strip(b.a);
  if(b.t==='warn') return strip(b.x);
  if(b.t==='fig') return strip(b.cap||'');
  if(b.t==='steps'){
    var st = b.x[si]; if(!st) return '';
    return strip(st.t) + (st.d ? strip(st.d) : '');
  }
  if(b.t==='cmp'){
    var side = si >= 50 ? 'b' : 'a', ix = si >= 50 ? si-50 : si;
    var d = b[side]; if(!d || !d.x) return '';
    return strip(d.x[ix] || '');
  }
  return '';
}
function allMarks(){
  var out = [];
  Object.keys(S.marks).forEach(function(tid){
    if(!TMAP[tid]) return;
    Object.keys(S.marks[tid]).forEach(function(key){
      var line = markLine(tid, key);
      if(!line) return;
      ranges(tid, key).forEach(function(r){
        var tx = line.slice(r[0], r[1]).trim();
        if(tx) out.push({tid:tid, key:key, text:tx, f:TMAP[tid].f, title:TMAP[tid].t.title});
      });
    });
  });
  return out;
}

/* ---------- score chart ---------- */
var chartField = null;

function sessionsFor(){
  return (S.sessions||[]).filter(function(x){
    if(!x || !x.total) return false;
    if((x.ex || 'g') !== examScope) return false;
    if(chartField && x.f !== chartField) return false;
    if(!chartField && x.kind === 'topic') return false;
    return true;
  }).slice().sort(function(a,b){ return a.at - b.at; });
}

function renderChart(){
  var data = sessionsFor();
  var cc = chartField ? ('var(--'+chartField+')') : 'var(--accent)';
  var h = '<div class="fchips" id="fchips" style="--cc:'+cc+'">';
  h += '<button data-act="cf:" aria-pressed="'+(!chartField)+'">全体</button>';
  FIELDS.forEach(function(f){
    if(!TB[f]) return;
    h += '<button data-act="cf:'+f+'" aria-pressed="'+(chartField===f)+'" style="--cc:var(--'+f+')">'+esc(TB[f].short)+'</button>';
  });
  h += '</div>';

  if(data.length < 1){
    h += '<div class="empty">まだ'+esc(scopeName())+'の記録がありません。<br>演習を1回やると、ここに点数の推移が出ます。</div>';
    return h;
  }

  var W = 360, H = 176, L = 28, R = 30, TP = 14, B = 28;
  var pw = W - L - R, ph = H - TP - B;
  var n = data.length;
  var X = function(i){ return n === 1 ? L + pw/2 : L + pw * i/(n-1); };
  var Y = function(v){ return TP + ph * (1 - v/100); };
  var pct = data.map(function(d){ return Math.round(d.correct/d.total*100); });

  var g = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(scopeName())+
          (chartField?'・'+esc(TB[chartField].short):'')+'の正答率の推移。'+
          pct.map(function(p,i){return (i+1)+'回目'+p+'パーセント'}).join('、')+'">';
  [0,25,50,75,100].forEach(function(v){
    g += '<line class="grid" x1="'+L+'" y1="'+Y(v)+'" x2="'+(W-R)+'" y2="'+Y(v)+'"/>';
    g += '<text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>';
  });
  g += '<line class="pass" x1="'+L+'" y1="'+Y(60)+'" x2="'+(W-R)+'" y2="'+Y(60)+'"/>';
  g += '<text x="'+(W-R+3)+'" y="'+(Y(60)+3)+'" text-anchor="start">合格</text>';

  // 全体は累積平均を主役の線に、各回の素点は薄い点で添える
  var avgSeries = [];
  var run = 0;
  pct.forEach(function(v,i){ run += v; avgSeries.push(run/(i+1)); });
  var main = chartField ? pct : avgSeries;

  if(!chartField){
    pct.forEach(function(v,i){
      g += '<circle class="raw" cx="'+X(i)+'" cy="'+Y(v)+'" r="3"/>';
    });
  }
  if(n > 1){
    g += '<polyline class="ln" points="'+main.map(function(v,i){ return X(i)+','+Y(v); }).join(' ')+'"/>';
  }
  main.forEach(function(v,i){
    var last = i === n-1;
    g += '<circle class="pt'+(last?' last':'')+'" cx="'+X(i)+'" cy="'+Y(v)+'" r="'+(last?4.5:3.5)+'"/>';
    g += '<circle class="hit" cx="'+X(i)+'" cy="'+Y(v)+'" r="16" data-pt="'+i+'"/>';
  });
  var lv = Math.round(main[n-1]);
  g += '<text class="val" x="'+(X(n-1)+8)+'" y="'+(Y(lv)+(lv>85?12:-7))+'" text-anchor="'+(n===1?'middle':'end')+'">'+lv+'%</text>';
  var d0 = new Date(data[0].at), d1 = new Date(data[n-1].at);
  g += '<text x="'+L+'" y="'+(H-10)+'" text-anchor="start">'+(d0.getMonth()+1)+'/'+d0.getDate()+'</text>';
  if(n > 1) g += '<text x="'+(W-R)+'" y="'+(H-10)+'" text-anchor="end">'+(d1.getMonth()+1)+'/'+d1.getDate()+'</text>';
  g += '</svg>';

  h += '<div class="chartwrap" id="chartwrap" style="--cc:'+cc+'">'+g+'<div id="tip" hidden></div></div>';

  if(!chartField){
    h += '<div class="legend">'+
      '<span><i class="k-ln"></i>全体の平均（累計）</span>'+
      '<span><i class="k-raw"></i>各回の点数</span></div>';
  }

  var sum = pct.reduce(function(a,b){return a+b;},0);
  var avg = Math.round(sum/n), best = Math.max.apply(null,pct);
  var delta = n>1 ? Math.round(main[n-1]) - Math.round(main[n-2]) : null;
  h += '<div class="statrow">';
  h += '<div><b class="num">'+avg+'%</b><small>全体の平均</small></div>';
  h += '<div><b class="num">'+pct[n-1]+'%</b><small>直近の点</small></div>';
  h += '<div><b class="num">'+best+'%</b><small>最高</small></div>';
  h += '<div><b class="num">'+(delta===null?'—':(delta>0?'+':'')+delta)+'</b><small>平均の増減</small></div>';
  h += '</div>';
  h += '<p class="tiny muted" style="margin:9px 0 0">'+
    (chartField ? '各回の点数をそのまま並べています。' : '太い線はそこまでの平均、薄い点は各回の点数です。')+
    '点をタップすると日付と内訳が出ます。破線は合格ライン（6割）。</p>';
  return h;
}

/* ---------- 単元ランキング ---------- */
var rankBy = 'score', rankUnit = 'topic';
function rankRows(){
  var rows = [];
  if(rankUnit === 'field'){
    FIELDS.forEach(function(f){
      if(!TB[f]) return;
      rows.push({key:f, name:TB[f].title, color:'var(--'+f+')', qs:poolBy(f)});
    });
  } else {
    FIELDS.forEach(function(f){
      if(!TB[f]) return;
      TB[f].topics.forEach(function(t){
        var qs = poolBy(f).filter(function(q){ return q.t === t.id; });
        if(qs.length) rows.push({key:t.id, name:t.title, sub:TB[f].short, color:'var(--'+f+')', qs:qs});
      });
    });
  }
  rows.forEach(function(r){
    r.acc = accuracy(r.qs);
    var p = paceOf(r.qs);
    r.sec = p ? p.sec : null;
    r.timed = p ? p.n : 0;
    r.done = r.qs.filter(function(q){ return answered(q.id); }).length;
    r.speed = speedScore(r.sec, examScope);
    r.score = (r.acc === null) ? null
      : (r.speed === null ? r.acc : Math.round(r.acc*0.7 + r.speed*0.3));
  });
  return rows.filter(function(r){ return r.done >= 3; });
}
function renderRank(){
  var box = document.getElementById('v-rank');
  if(!box) return;
  var rows = rankRows();
  var h = '<h2 class="disp" style="font-size:19px;margin:2px 0 10px">ランキング</h2>';
  h += '<div class="seg">'+
    '<button data-act="scope:g" aria-pressed="'+(examScope==="g")+'">学科</button>'+
    '<button data-act="scope:j" aria-pressed="'+(examScope==="j")+'">実技</button></div>';
  h += '<div class="card"><p class="eyebrow">'+esc(scopeName())+'　'+
    (examScope==='j'?'本番は20問60分＝1問180秒':'本番は60問60分＝1問60秒')+'</p>';
  h += '<div class="fchips" style="--cc:var(--accent)">'+
    '<button data-act="ru:topic" aria-pressed="'+(rankUnit==='topic')+'">単元別</button>'+
    '<button data-act="ru:field" aria-pressed="'+(rankUnit==='field')+'">分野別</button>'+
    '<span style="flex:none;width:8px"></span>'+
    '<button data-act="rb:score" aria-pressed="'+(rankBy==='score')+'">総合</button>'+
    '<button data-act="rb:acc" aria-pressed="'+(rankBy==='acc')+'">正答率</button>'+
    '<button data-act="rb:sec" aria-pressed="'+(rankBy==='sec')+'">速さ</button>'+
    '<button data-act="rb:weak" aria-pressed="'+(rankBy==='weak')+'">弱い順</button></div>';
  if(!rows.length){
    h += '<div class="empty">3問以上解いた'+(rankUnit==='topic'?'単元':'分野')+
      'から並びます。<br>まずは解いてみてください。</div></div>';
    box.innerHTML = h + askEntry();
    return;
  }
  rows.sort(function(a,b){
    if(rankBy === 'acc') return (b.acc||0)-(a.acc||0);
    if(rankBy === 'sec'){
      if(a.sec === null) return 1; if(b.sec === null) return -1;
      return a.sec-b.sec;
    }
    if(rankBy === 'weak') return (a.score===null?999:a.score)-(b.score===null?999:b.score);
    return (b.score||0)-(a.score||0);
  });
  rows.forEach(function(r, i){
    var gr = gradeOf(r.score);
    h += '<div class="rank"><span class="pos">'+(i+1)+'</span>'+
      '<span class="gr" style="background:'+(r.score===null?'var(--line-2)':gr.c)+'">'+gr.g+'</span>'+
      '<span class="nm"><b>'+esc(r.name)+'</b><small>'+
      (r.sub?esc(r.sub)+'　':'')+r.done+'/'+r.qs.length+'問　'+
      (r.acc===null?'—':r.acc+'%')+'　'+fmtSec(r.sec)+'/問</small></span>'+
      '<span class="sc" style="color:'+gr.c+'">'+(r.score===null?'—':r.score)+'</span></div>';
  });
  var last = rows[rows.length-1];
  if(rankBy !== 'sec' && last && last.score !== null){
    h += '<p class="tiny muted" style="margin:10px 0 0">いちばん下は<b>'+esc(last.name)+'</b>（'+
      last.acc+'%・'+fmtSec(last.sec)+'/問）。ここから潰すと伸びます。</p>';
  }
  var slow = rows.filter(function(r){ return r.sec !== null; })
    .sort(function(a,b){ return b.sec-a.sec; })[0];
  if(slow) h += '<p class="tiny muted" style="margin:6px 0 0">いちばん時間を食っているのは<b>'+
    esc(slow.name)+'</b>（'+fmtSec(slow.sec)+'/問）。本番の目安は1問'+EXAMS[examScope].sec+'秒。</p>';
  h += '</div>';
  var lows = rows.slice().sort(function(a,b){
    return (a.score===null?999:a.score)-(b.score===null?999:b.score); }).slice(0,3);
  if(lows.length){
    h += '<div class="card"><p class="eyebrow">下位から出題する</p>';
    lows.forEach(function(r){
      h += '<div class="todo"><span class="t"><b>'+esc(r.name)+'</b><small>'+
        (r.acc===null?'—':r.acc+'%')+'　'+fmtSec(r.sec)+'/問</small></span>'+
        '<button class="go" data-act="'+(rankUnit==='field'?'field:':'topicquiz:')+r.key+'">解く</button></div>';
    });
    h += '</div>';
  }
  box.innerHTML = h + askEntry();
}

/* ---------- ask Claude ---------- */
var ask = { ctx:null, turns:[], busy:false, partial:'', err:'', ctl:null };

var RULES = [
 'あなたはFP技能検定3級の講師です。相手は2026年10月2日に3級（学科）を受検します。',
 '次のルールで答えてください。',
 '・日本語。まず結論を一文で、そのあとに理由。前置きや挨拶は書かない。',
 '・試験で問われる形に即して説明する。試験に出ないことは書かない。',
 '・具体例や数字を使う。計算は途中式を必ず示す。',
 '・税率・控除額・年金額など毎年改正される数値は、断定せず「受検年度のテキストで確認を」と添える。',
 '・引っかけられやすい点があれば最後に一行で指摘する。',
 '・分からないことは分からないと答える。',
 '・全体で400字程度。長くしない。'
].join('\n');

function topicText(t){
  var out = [t.title, ''];
  (t.blocks||[]).forEach(function(b){
    if(b.t==='p') out.push(strip(b.x));
    else if(b.t==='ul') b.x.forEach(function(li){ out.push('・'+strip(li)); });
    else if(b.t==='table'){
      out.push(b.head.map(strip).join(' / '));
      b.rows.forEach(function(r){ out.push(r.map(strip).join(' / ')); });
    }
    else if(b.t==='ex'){ out.push('例：'+strip(b.q)); out.push('→ '+strip(b.a)); }
    else if(b.t==='key'){ (Array.isArray(b.x)?b.x:[b.x]).forEach(function(k){ out.push('暗記：'+strip(k)); }); }
    else if(b.t==='warn') out.push('注意：'+strip(b.x));
    else if(b.t==='fig'){ if(b.cap) out.push('図：'+strip(b.cap)); }
    else if(b.t==='steps') b.x.forEach(function(st,i2){ out.push((i2+1)+'. '+strip(st.t)+(st.d?'　'+strip(st.d):'')); });
    else if(b.t==='cmp'){
      ['a','b'].forEach(function(side){
        var d=b[side]; if(!d) return;
        out.push('【'+strip(d.t)+'】');
        (d.x||[]).forEach(function(li){ out.push('・'+strip(li)); });
      });
    }
  });
  return out.join('\n').slice(0, 3000);
}
function strip(h){ return String(h).replace(/<[^>]*>/g,''); }

function ctxText(c){
  if(!c) return '';
  if(c.kind==='q'){
    var q = QMAP[c.id]; if(!q) return '';
    var opts = q.type==='ox' ? ['○（正しい）','×（誤り）'] : q.c;
    return '【いま解いた問題】\n' + (q.ctx ? strip(q.ctx.replace(/<\/(tr|table|div|p)>/g,'\n')) + '\n' : '') + q.q + '\n' +
      opts.map(function(o,i){ return (i+1)+'. '+o+(i===q.a?'  ←正解':''); }).join('\n') +
      '\n解説：' + q.e;
  }
  if(c.kind==='t'){
    var info = TMAP[c.id]; if(!info) return '';
    return '【いま読んでいる章】\n' + topicText(info.t);
  }
  return '';
}
function ctxLabel(c){
  if(!c) return '';
  if(c.kind==='q'){ var q=QMAP[c.id]; return q ? 'この問題について：' + q.q.slice(0,42) + (q.q.length>42?'…':'') : ''; }
  if(c.kind==='t'){ var i=TMAP[c.id]; return i ? 'この章について：' + i.t.title : ''; }
  return '';
}

function openAsk(kind, id){
  var same = ask.ctx && ask.ctx.kind===kind && ask.ctx.id===id;
  if(!same){ ask.ctx = (kind ? {kind:kind, id:id} : null); ask.turns = []; ask.partial=''; ask.err=''; }
  renderAsk(); show('ask');
  setTimeout(function(){ var ta=document.getElementById('askInput'); if(ta) ta.focus(); }, 60);
}

function renderAsk(){
  var box = document.getElementById('v-ask'); if(!box) return;
  var h = '';
  if(!sampleFn){
    h += '<h2 class="disp" style="font-size:19px;margin:2px 0 8px">質問</h2>';
    h += '<div class="card"><div class="empty">この画面ではClaudeに質問できません。<br>'+
         'claude.ai で開き直すと使えるようになります。</div></div>';
    box.innerHTML = h; return;
  }
  h += '<h2 class="disp" style="font-size:19px;margin:2px 0 2px">質問</h2>';
  h += '<p class="tiny muted" style="margin:0 0 12px">分からないところを、そのまま聞いてください。</p>';

  if(ask.ctx){
    h += '<div class="askctx"><span class="l">文脈</span><span>'+esc(ctxLabel(ask.ctx))+'</span>'+
         '<button class="x" data-act="askclear" aria-label="文脈を外す">×</button></div>';
  }

  h += '<div class="card">';
  if(!ask.turns.length && !ask.busy){
    h += '<div class="empty" style="padding:14px 6px">'+
      (ask.ctx ? 'この内容について何でも聞けます。' : '教科書・問題・計算のやり方、なんでもどうぞ。')+'</div>';
    h += '<div class="sugg">';
    var sugg = ask.ctx
      ? ['なぜその答えになるの？','覚え方のコツは？','似た論点との違いは？','もう1つ例を出して']
      : ['6つの係数の見分け方','建蔽率と容積率の解き方','損益通算できる所得は？','相続分の出し方'];
    sugg.forEach(function(x){ h += '<button data-sugg="'+esc(x)+'">'+esc(x)+'</button>'; });
    h += '</div>';
  }

  h += '<div class="msgs" id="askMsgs">';
  ask.turns.forEach(function(t){
    if(t.role==='user') h += '<div class="msg me"><div class="who">じぶん</div><div class="body">'+esc(t.content)+'</div></div>';
    else h += '<div class="msg ai"><div class="who">CLAUDE</div><div class="body">'+fmt(t.content)+'</div></div>';
  });
  if(ask.busy){
    h += '<div class="msg ai"><div class="who">CLAUDE</div><div class="body" id="askLive">'+
      (ask.partial ? fmt(ask.partial) : '<span class="thinking"><i></i>考えています…</span>')+'</div></div>';
  }
  if(ask.err) h += '<div class="msg err"><div class="body">'+esc(ask.err)+'</div></div>';
  h += '</div>';

  h += '<div class="composer"><textarea id="askInput" rows="2" placeholder="'+
       (ask.ctx?'この内容について質問する':'質問を入力')+'"></textarea>';
  h += '<div class="act"><span class="hint">'+(ask.busy?'回答中':'あなたのClaudeの利用枠を使います')+'</span>';
  if(ask.busy) h += '<button class="send" data-act="askstop" style="background:var(--bad)">停止</button>';
  else h += '<button class="send" id="askSend" data-act="asksend">送信</button>';
  h += '</div></div>';
  h += '</div>';
  box.innerHTML = h;

  var ta = document.getElementById('askInput');
  if(ta){
    ta.value = ask.draft || '';
    ta.addEventListener('input', function(){
      ask.draft = ta.value;
      ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px';
    });
    ta.addEventListener('keydown', function(ev){
      if(ev.key==='Enter' && (ev.metaKey||ev.ctrlKey)){ ev.preventDefault(); sendAsk(); }
    });
  }
}
function fmt(t){
  var x = esc(t);
  x = x.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  x = x.replace(/^[-*・]\s+/gm, '・');
  return x;
}
function sendAsk(text){
  if(!sampleFn || ask.busy) return;
  var ta = document.getElementById('askInput');
  var msg = (text !== undefined ? text : (ta ? ta.value : '')).trim();
  if(!msg) return;
  ask.turns.push({role:'user', content:msg});
  ask.turns = ask.turns.slice(-10);
  ask.draft = ''; ask.err = ''; ask.partial = ''; ask.busy = true;
  renderAsk();
  var msgs = document.getElementById('askMsgs');
  if(msgs) msgs.scrollIntoView({block:'end', behavior:'smooth'});

  var lead = RULES;
  var cx = ctxText(ask.ctx);
  if(cx) lead += '\n\n' + cx;
  var input = [{role:'user', content:lead}].concat(ask.turns.map(function(t){
    return {role:t.role, content:t.content};
  }));

  ask.ctl = new AbortController();
  sampleFn(input, {
    signal: ask.ctl.signal,
    cache: false,
    onText: function(u){
      ask.partial = u.text;
      var live = document.getElementById('askLive');
      if(live) live.innerHTML = fmt(u.text);
    }
  }).then(function(r){
    ask.turns.push({role:'assistant', content:r.text});
    ask.busy = false; ask.partial=''; ask.ctl=null;
    renderAsk();
  }).catch(function(e){
    ask.busy = false; ask.ctl = null;
    if(e && e.text){ ask.turns.push({role:'assistant', content:e.text}); }
    ask.partial = '';
    ask.err = askErr(e && e.code);
    if(e && e.code==='cancelled') ask.err = '';
    renderAsk();
  });
}
function askErr(code){
  if(code==='not_granted' || code==='sampling_disabled') return 'Claudeへの質問が許可されていません。画面の許可ダイアログで「許可」を選ぶと使えます。';
  if(code==='rate_limited') return '短時間に聞きすぎたようです。少し時間をおいてからもう一度。';
  if(code==='session_expired') return 'ログインし直してください。';
  if(code==='prompt_too_large') return '内容が長すぎました。質問を短く区切ってください。';
  if(code==='refused') return 'この内容には答えられませんでした。聞き方を変えてみてください。';
  return '答えを取得できませんでした。もう一度試してください。';
}

/* ---------- personalised question generation ---------- */
var gen = { busy:false, err:'', note:'' };
function topicIdList(){
  var out = [];
  FIELDS.forEach(function(f){
    if(!TB[f]) return;
    TB[f].topics.forEach(function(t){ out.push(t.id+'='+t.title); });
  });
  return out.join('、');
}
function weakBrief(){
  var lines = [];
  var rates = [];
  FIELDS.forEach(function(f){
    if(!TB[f]) return;
    var a = accuracy(poolBy(f));
    if(a!==null) rates.push({f:f, a:a});
  });
  rates.sort(function(x,y){ return x.a-y.a; });
  if(rates.length) lines.push('分野別の正答率：' + rates.map(function(r){ return TB[r.f].title+' '+r.a+'%'; }).join('、'));
  var w = weakList().slice(0,12);
  if(w.length){
    lines.push('実際に間違えた問題：');
    w.forEach(function(q){
      var st = stat(q.id);
      lines.push('・[' + TB[q.f].short + '] ' + q.q.slice(0,90) + '（' + st.w + '回誤答）');
    });
  }
  var unread = [];
  FIELDS.forEach(function(f){
    if(!TB[f]) return;
    TB[f].topics.forEach(function(t){ if(!S.read[t.id] && unread.length<8) unread.push(t.title); });
  });
  if(unread.length) lines.push('まだ読んでいない章：' + unread.join('、'));
  return lines.join('\n').slice(0, 4000);
}
function validGen(arr, stamp){
  var out = [];
  if(!Array.isArray(arr)) return out;
  arr.forEach(function(r, i){
    if(!r || typeof r.q !== 'string' || !r.q.trim()) return;
    if(typeof r.e !== 'string' || !r.e.trim()) return;
    var f = FIELDS.indexOf(r.f) >= 0 ? r.f : null;
    var t = (r.t && TMAP[r.t]) ? r.t : null;
    if(!f && t) f = TMAP[t].f;
    if(!f) return;
    if(!t){ var tp = TB[f] && TB[f].topics[0]; if(!tp) return; t = tp.id; }
    if(TMAP[t].f !== f) f = TMAP[t].f;
    var type = r.type === 'mc' ? 'mc' : 'ox';
    var a = Number(r.a);
    var q = { id:'g'+stamp+'-'+i, f:f, t:t, type:type, q:String(r.q).trim(), e:String(r.e).trim(), gen:1 };
    if(type==='mc'){
      if(!Array.isArray(r.c) || r.c.length !== 3) return;
      if(!(a>=0 && a<=2)) return;
      q.c = r.c.map(function(x){ return String(x); });
    } else {
      if(!(a===0 || a===1)) return;
    }
    q.a = a;
    out.push(q);
  });
  return out;
}
function generate(n, fieldOnly){
  if(!sampleFn || gen.busy) return;
  gen.busy = true; gen.err=''; gen.note='';
  renderWeak(); renderDrill();
  var brief = weakBrief();
  var scope = fieldOnly && TB[fieldOnly] ? ('必ず「'+TB[fieldOnly].title+'」の範囲から出題してください。') :
    '間違いが多い分野・論点を重点的に、複数分野から出題してください。';
  var prompt = [
   'FP技能検定3級（学科）の問題を' + n + '問作ってください。',
   '',
   'この受検者の学習状況：',
   brief || '（まだ記録がありません。頻出論点から出題してください。）',
   '',
   scope,
   '条件：',
   '・実際の3級学科と同じ難易度。ひねりすぎない。',
   '・上に挙がっている問題文をそのまま使わず、同じ論点を別の角度から問う。',
   '・解説（e）は結論→理由の順で、80〜150字。引っかけ所があれば書く。',
   '・毎年改正される金額を正解の決め手にしない（配偶者控除38万円など安定した数値は可）。',
   '',
   '返答はJSON配列だけ。ほかの文章は書かない。形式：',
   '[{"q":"問題文","type":"ox","a":0,"e":"解説","t":"f3-04"},',
   ' {"q":"問題文","type":"mc","c":["選択肢1","選択肢2","選択肢3"],"a":0,"e":"解説","t":"f5-05"}]',
   'type="ox" のとき a は 0=正しい / 1=誤り、c は不要。',
   'type="mc" のとき c はちょうど3つ、a は正解の添字(0〜2)。',
   't' + ' は次から必ず選ぶ：' + topicIdList()
  ].join('\n');

  sampleFn.json(prompt, { cache:false, modelTier:'default' }).then(function(arr){
    var list = validGen(arr, Date.now());
    if(!list.length){ gen.busy=false; gen.err='問題を作れませんでした。もう一度試してください。'; renderWeak(); renderDrill(); return; }
    S.gen = S.gen.concat(list).slice(-150);
    addQuestions(list);
    scheduleSave();
    gen.busy = false; gen.note = list.length + '問できました。';
    render();
    startQuiz(list, 'あなた専用の' + list.length + '問', 'weak');
  }).catch(function(e){
    gen.busy = false;
    gen.err = (e && e.code==='invalid_json') ? '形式が崩れました。もう一度試してください。' : askErr(e && e.code);
    renderWeak(); renderDrill();
  });
}

/* ---------- quiz engine ---------- */
var quiz = null, quizTab = 'drill';
function startQuiz(list, label, backTab, meta){
  if(!list.length) return;
  meta = meta || {};
  quiz = { list:list, i:0, correct:0, label:label, log:[], answeredNow:false,
           kind:meta.kind||'other', f:meta.f||null, ex:meta.ex||examScope,
           qStart:0, spent:0, timed:0 };
  quizTab = backTab || 'drill';
  saveQuiz();
  renderQuiz(); show('quiz');
}
function saveQuiz(){
  if(!quiz || quiz.i >= quiz.list.length){ S.quiz = null; }
  else S.quiz = { ids:quiz.list.map(function(q){return q.id}), i:quiz.i, correct:quiz.correct,
                  label:quiz.label, tab:quizTab, log:quiz.log, at:Date.now(),
                  kind:quiz.kind, f:quiz.f, ex:quiz.ex, spent:quiz.spent, timed:quiz.timed };
  scheduleSave();
}
function resumeQuiz(){
  var r = S.quiz; if(!r) return;
  var list = (r.ids||[]).map(function(id){ return QMAP[id]; }).filter(Boolean);
  if(list.length !== (r.ids||[]).length || !list.length){ S.quiz=null; scheduleSave(); renderHome(); return; }
  quiz = { list:list, i:Math.min(r.i||0, list.length), correct:r.correct||0,
           label:r.label||'続き', log:r.log||[], answeredNow:false,
           kind:r.kind||'other', f:r.f||null, ex:r.ex||'g',
           qStart:0, spent:r.spent||0, timed:r.timed||0 };
  examScope = quiz.ex;
  quizTab = r.tab || 'drill';
  renderQuiz(); show('quiz');
}
function renderQuiz(){
  if(!quiz) return;
  if(quiz.i >= quiz.list.length) return renderResult();
  var q = quiz.list[quiz.i];
  var opts = q.type==='ox' ? ['○（正しい）','×（誤り）'] : q.c;
  var h = '';
  h += '<div class="qhead"><span class="prog"><span class="bar"><i style="width:'+
       Math.round(quiz.i/quiz.list.length*100)+'%"></i></span></span>'+
       '<span class="cnt num">'+(quiz.i+1)+' / '+quiz.list.length+'</span>'+
       '<span class="clock num" id="clock" title="この問題にかかっている時間">0:00</span></div>';
  h += '<div class="card">';
  h += '<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">'+fieldChip(q.f)+
       '<span class="tiny muted" style="font-size:11px;flex:1;min-width:0">'+esc(quiz.label)+'</span>'+
       starBtn(q.id)+'</div>';
  if(q.ctx) h += '<div class="qctx">'+q.ctx+'</div>';
  h += '<div class="qtext">'+rich(q.q)+'</div>';
  h += '<div id="opts">';
  opts.forEach(function(o,i){
    h += '<button class="opt" data-pick="'+i+'"><span class="mk">'+(q.type==='ox'?(i===0?'○':'×'):String(i+1))+'</span><span>'+esc(o)+'</span></button>';
  });
  h += '</div><div id="fb"></div></div>';
  document.getElementById('v-quiz').innerHTML = h;
  startClock();
}
var clockTimer = null;
function startClock(){
  stopClock();
  quiz.qStart = Date.now();
  tickClock();
  clockTimer = setInterval(tickClock, 1000);
}
function stopClock(){ if(clockTimer){ clearInterval(clockTimer); clockTimer = null; } }
function tickClock(){
  var el = document.getElementById('clock');
  if(!el || !quiz || !quiz.qStart){ return; }
  var sec = Math.floor((Date.now() - quiz.qStart)/1000);
  el.textContent = Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  var target = EXAMS[quiz.ex || examScope].sec;
  el.className = 'clock num' + (sec > target*2 ? ' over' : (sec > target ? ' warn' : ''));
}
function pick(i){
  var q = quiz.list[quiz.i];
  if(quiz.answeredNow) return;
  quiz.answeredNow = true;
  var ms = quiz.qStart ? (Date.now() - quiz.qStart) : 0;
  stopClock();
  if(ms > 0 && ms <= MAXMS){ quiz.spent += ms; quiz.timed++; }
  var correct = (i === q.a);
  if(correct) quiz.correct++;
  record(q.id, correct, ms);
  quiz.log.push({id:q.id, correct:correct, ms:ms});
  Array.prototype.forEach.call(document.querySelectorAll('#opts .opt'), function(b){
    var idx = Number(b.dataset.pick);
    b.disabled = true;
    var mk = b.querySelector('.mk');
    if(idx === q.a){ b.classList.add('ok'); if(mk) mk.textContent = '\u2713'; }
    else if(idx === i){ b.classList.add('ng'); if(mk) mk.textContent = '\u2715'; }
  });
  var info = TMAP[q.t];
  var tsec = ms/1000, tgt = EXAMS[quiz.ex || examScope].sec;
  var h = '<div class="verdict '+(correct?'ok':'ng')+'">';
  h += '<div class="v">'+(correct?'◎ 正解':'× 不正解')+
       (ms > 0 && ms <= MAXMS ? '<span class="qtime'+(tsec > tgt ? ' slow':'')+'">'+fmtSec(tsec)+'</span>' : '')+'</div>';
  h += '<div>'+rich(q.e)+'</div>';
  if(info) h += '<div class="lnk"><button data-act="topic:'+q.t+'">→ 教科書：'+esc(info.t.title)+'</button></div>';
  h += '</div>';
  if(sampleFn) h += '<button class="askbtn" data-act="askq:'+q.id+'">この問題について質問する</button>';
  h += '<button class="btn primary sticky-act" id="nextBtn">'+
       (quiz.i+1 >= quiz.list.length ? '結果を見る' : '次の問題へ')+'</button>';
  var fb = document.getElementById('fb');
  fb.innerHTML = h;
  var nb = document.getElementById('nextBtn');
  nb.addEventListener('click', function(){ quiz.i++; quiz.answeredNow=false; saveQuiz(); renderQuiz(); window.scrollTo(0,0); });
  nb.focus({preventScroll:true});
  fb.scrollIntoView({behavior:'smooth', block:'nearest'});
}
function renderResult(){
  var pct = Math.round(quiz.correct/quiz.list.length*100);
  var isMock = quiz.kind === 'mock';
  var needed = Math.ceil(quiz.list.length * 0.6);
  var pass = isMock ? quiz.correct >= needed : pct >= 60;
  if(quiz.kind !== 'one'){
    S.sessions.unshift({at:Date.now(), label:quiz.label, total:quiz.list.length, correct:quiz.correct,
                        kind:quiz.kind, f:quiz.f, ex:quiz.ex,
                        spent:quiz.spent||0, timed:quiz.timed||0});
    S.sessions = S.sessions.slice(0,60);
  }
  S.quiz = null;
  scheduleSave();

  var wrong = quiz.log.filter(function(l){return !l.correct}).map(function(l){return QMAP[l.id]}).filter(Boolean);
  var h = '<div class="card"><div class="score">';
  h += '<b class="num disp">'+quiz.correct+'</b>';
  h += '<div class="of">/ '+quiz.list.length+'問　正答率 '+pct+'%</div>';
  h += '<span class="judge '+(pass?'pass':'fail')+'">'+
       (isMock ? (pass?'合格ライン到達（'+needed+'問以上）':'あと'+(needed-quiz.correct)+'問で合格ライン')
               : (pass?'よくできています':'復習しましょう'))+'</span>';
  h += '</div></div>';

  if(quiz.timed){
    var avg = quiz.spent/quiz.timed/1000;
    var tgt = EXAMS[quiz.ex || examScope].sec;
    var sp = speedScore(avg, quiz.ex);
    var total = Math.round(pct*0.7 + sp*0.3);
    var gr = gradeOf(total);
    h += '<div class="card"><p class="eyebrow">ペース</p><div class="pacebar">'+
      '<div><b>'+fmtSec(avg)+'</b><small>1問あたり</small></div>'+
      '<div><b>'+sp+'</b><small>速度点</small></div>'+
      '<div><b>'+pct+'</b><small>正答率</small></div>'+
      '<div><b style="color:'+gr.c+'">'+gr.g+'</b><small>総合 '+total+'</small></div></div>';
    h += '<p class="tiny muted" style="margin:9px 0 0">本番は'+esc(scopeName())+
      (quiz.ex==='j'?'20問60分＝1問<b>180秒</b>':'60問60分＝1問<b>60秒</b>')+'。'+
      (avg <= tgt ? '本番ペースに乗っています。' :
       avg <= tgt*1.5 ? 'あと少し。見直しの時間を作るには1問'+tgt+'秒を目標に。' :
       '本番だと時間が足りません。迷ったら飛ばす練習を。')+
      '　総合点は正答率7割＋速度3割で出しています。</p></div>';
  }

  var byF = {};
  quiz.log.forEach(function(l){
    var q = QMAP[l.id]; if(!q) return;
    byF[q.f] = byF[q.f] || {n:0,c:0};
    byF[q.f].n++; if(l.correct) byF[q.f].c++;
  });
  var keys = Object.keys(byF);
  if(keys.length>1){
    h += '<div class="card"><p class="eyebrow">分野別</p>';
    FIELDS.forEach(function(f){
      if(!byF[f]) return;
      var r = Math.round(byF[f].c/byF[f].n*100);
      h += '<div style="display:flex;align-items:center;gap:9px;padding:6px 0">';
      h += '<span style="flex:none;width:74px;font-size:12px;font-weight:700">'+esc(TB[f].short)+'</span>';
      h += '<span class="bar" style="flex:1"><i style="width:'+r+'%;background:var(--'+f+')"></i></span>';
      h += '<span class="num" style="flex:none;width:52px;text-align:right;font-size:12.5px">'+byF[f].c+'/'+byF[f].n+'</span></div>';
    });
    h += '</div>';
  }

  if(wrong.length){
    h += '<div class="card"><p class="eyebrow">間違えた問題（'+wrong.length+'）</p>';
    wrong.forEach(function(q){
      var info = TMAP[q.t];
      h += '<div class="wq"><div class="m">'+fieldChip(q.f)+'</div>';
      h += '<div class="txt">'+rich(q.q)+'</div>';
      h += '<div class="txt muted" style="margin-top:4px">'+rich(q.e)+'</div>';
      if(info) h += '<div style="margin-top:5px"><button style="background:none;border:0;padding:0;font-size:12px;font-weight:700;color:var(--accent-ink);text-decoration:underline" data-act="topic:'+q.t+'">→ '+esc(info.t.title)+'</button></div>';
      h += '</div>';
    });
    h += '<button class="btn primary" style="margin-top:12px" data-act="retry">間違えた'+wrong.length+'問をもう一度</button>';
    h += '</div>';
  } else {
    h += '<div class="card"><div class="empty">全問正解です。</div></div>';
  }
  h += '<div class="btnrow" style="margin-top:12px"><button class="btn" data-act="go:drill">演習メニュー</button>'+
       '<button class="btn" data-act="go:home">ホーム</button></div>';
  quiz.wrongIds = wrong.map(function(q){return q.id});
  document.getElementById('v-quiz').innerHTML = h;
}

/* ---------- quiz builders ---------- */
function mockSet(){
  var cfg = EXAMS[examScope], want = cfg.mock, out = [];
  FIELDS.forEach(function(f){ out = out.concat(shuffle(poolBy(f)).slice(0, cfg.per)); });
  if(out.length < want){
    var rest = shuffle(pool().filter(function(q){ return out.indexOf(q)<0; }));
    out = out.concat(rest.slice(0, want-out.length));
  }
  return shuffle(out).slice(0, want);
}
var FIELD_N = 20;
function pickWeak(n){
  var w = weakList();
  var d = dueList().filter(function(q){ return w.indexOf(q)<0; });
  var pool = w.concat(d);
  return pool.slice(0, n);
}

/* ---------- actions ---------- */
document.addEventListener('click', function(ev){
  if(ev.target.closest){
    var hitMark = ev.target.closest('mark.hl');
    if(hitMark && !ev.target.closest('[data-act]')){
      var selNow = window.getSelection();
      if(selNow && selNow.isCollapsed){
        var rg = document.createRange();
        rg.selectNodeContents(hitMark);
        selNow.removeAllRanges(); selNow.addRange(rg);
        updateSelBar();
        return;
      }
    }
  }
  var ptEl = ev.target.closest ? ev.target.closest('[data-pt]') : null;
  if(ptEl){ showTip(Number(ptEl.dataset.pt)); return; }
  var el2 = ev.target.closest ? ev.target.closest('[data-act],[data-pick],[data-sugg]') : null;
  if(!el2) return;
  if(el2.hasAttribute('data-pick')){ pick(Number(el2.dataset.pick)); return; }
  if(el2.hasAttribute('data-sugg')){ sendAsk(el2.dataset.sugg); return; }
  var act = el2.dataset.act || '';
  var p = act.split(':'), k = p[0], v = p.slice(1).join(':');

  if(k==='go'){ bookView=null; render(); show(v); return; }
  if(k==='book'){ bookView = v ? {field:v} : null; renderBook(); show('book'); return; }
  if(k==='topic'){ bookView = {topic:v}; renderBook(); show('book'); return; }
  if(k==='read'){
    if(S.read[v]) delete S.read[v]; else S.read[v] = Date.now();
    scheduleSave(); renderBook(); renderHome(); return;
  }
  if(k==='field'){
    var qs = shuffle(poolBy(v)).slice(0, FIELD_N);
    startQuiz(qs, (TB[v] ? TB[v].short : '分野別') + ' ' + qs.length + '問',
              'drill', {kind:'field', f:v, ex:examScope}); return;
  }
  if(k==='scope'){
    if(v!==examScope){
      examScope = v;
      try{ localStorage.setItem(LS+'-scope', v); }catch(e){}
      chartField = null;
      render();
    }
    return;
  }
  if(k==='topicquiz'){
    var tq = shuffle(QS.filter(function(q){return q.t===v}));
    var inf = TMAP[v];
    startQuiz(tq, inf ? inf.t.title : '章別', 'book', {kind:'topic', f:(inf?inf.f:null), ex:'g'}); return;
  }
  if(k==='qbm'){
    toggleQbm(v);
    var bq = document.querySelector('[data-act="qbm:'+v+'"]');
    if(bq){ var on = qbmOn(v); bq.className = 'star'+(on?' on':''); bq.textContent = on?'★':'☆';
      bq.setAttribute('aria-pressed', String(on)); }
    if(cur === 'weak') renderWeak();
    renderDrill();
    return;
  }
  if(k==='qbmquiz'){
    var qbq = qbmList(examScope);
    if(qbq.length) startQuiz(shuffle(qbq), '★ ブックマーク '+qbq.length+'問', 'drill', {kind:'qbm', ex:examScope});
    return;
  }
  if(k==='one'){
    var oq = QMAP[v];
    if(oq) startQuiz([oq], 'この1問', 'weak', {kind:'one', f:oq.f, ex:exOf(oq)});
    return;
  }
  if(k==='review'){ startQuiz(shuffle(dueList()).slice(0,20), '復習テスト', 'drill', {kind:'review'}); return; }
  if(k==='weak'){ startQuiz(shuffle(pickWeak(20)), '弱点つぶし', 'drill', {kind:'weak'}); return; }
  if(k==='mock'){
    var ms = mockSet();
    startQuiz(ms, scopeName()+'模試 '+ms.length+'問', 'drill', {kind:'mock'}); return;
  }
  if(k==='random'){
    startQuiz(shuffle(pool()).slice(0,20), scopeName()+'ランダム20問', 'drill', {kind:'random'}); return;
  }
  if(k==='retry'){
    var ids = (quiz && quiz.wrongIds) || [];
    var rq = ids.map(function(i){return QMAP[i]}).filter(Boolean);
    if(rq.length) startQuiz(shuffle(rq), '間違い直し', 'drill');
    return;
  }
  if(k==='mkadd' || k==='mkdel'){
    var info3 = selInfo(), tid3 = bookView && bookView.topic;
    if(info3 && tid3){
      S.marks[tid3] = S.marks[tid3] || {};
      var curRanges = ranges(tid3, info3.key);
      var next = (k==='mkadd')
        ? mergeRanges(curRanges.concat([[info3.s, info3.e]]))
        : subRange(curRanges, info3.s, info3.e);
      if(next.length) S.marks[tid3][info3.key] = next; else delete S.marks[tid3][info3.key];
      if(!Object.keys(S.marks[tid3]).length) delete S.marks[tid3];
      scheduleSave();
      var sel2 = window.getSelection(); if(sel2) sel2.removeAllRanges();
      var bar2 = document.getElementById('selbar'); if(bar2) bar2.hidden = true;
      refreshMarks();
      renderHome();
    }
    return;
  }
  if(k==='mkclear'){
    var b3 = document.getElementById('selbar'); if(b3) b3.hidden = true;
    askConfirm('この章の線を<b>すべて消します</b>。元に戻せません。', '消す', true, function(){
      delete S.marks[v]; scheduleSave(); renderBook(); renderHome();
    });
    return;
  }
  if(k==='bm'){
    var exist = S.bm.filter(function(b){ return b.topic===v; })[0];
    if(exist){
      S.bm = S.bm.filter(function(b){ return b.id!==exist.id; });
    } else {
      var info2 = TMAP[v];
      var def = info2 ? info2.t.title : 'ブックマーク';
      askText('ブックマークの名前（あとで探しやすい名前に）', def, function(nm){
        S.bm.push({ id:'bm'+Date.now(), topic:v, name:(nm||def).slice(0,60), at:Date.now() });
        scheduleSave(); renderBook();
      });
      return;
    }
    scheduleSave(); renderBook(); return;
  }
  if(k==='bmren'){
    var t2 = S.bm.filter(function(b){ return b.id===v; })[0];
    if(t2) askText('新しい名前', t2.name, function(nn){
      if(nn){ t2.name = nn.slice(0,60); scheduleSave(); renderBook(); }
    });
    return;
  }
  if(k==='bmdel'){ S.bm = S.bm.filter(function(b){ return b.id!==v; }); scheduleSave(); renderBook(); return; }
  if(k==='resume'){ resumeQuiz(); return; }
  if(k==='dropresume'){ S.quiz=null; scheduleSave(); renderHome(); return; }
  if(k==='cf'){ chartField = v || null; renderWeak(); return; }
  if(k==='rb'){ rankBy = v; renderRank(); return; }
  if(k==='ru'){ rankUnit = v; renderRank(); return; }
  if(k==='ask'){ openAsk(null, null); return; }
  if(k==='askq'){ openAsk('q', v); return; }
  if(k==='askt'){ openAsk('t', v); return; }
  if(k==='askclear'){ ask.ctx=null; renderAsk(); return; }
  if(k==='asksend'){ sendAsk(); return; }
  if(k==='askstop'){ if(ask.ctl) ask.ctl.abort(); return; }
  if(k==='gen'){ generate(Number(v)||8, null); return; }
  if(k==='genf'){ generate(8, v); return; }
  if(k==='reset'){
    askConfirm('学習記録を<b>すべて消去</b>します。解答の記録・読了・引いた線・ブックマーク・'+
      '得点の推移が消え、<b>元に戻せません</b>。', 'すべて消去する', true, function(){
      S.stats={}; S.read={}; S.sessions=[]; S.marks={}; S.bm=[]; S.qbm=[]; S.quiz=null;
      scheduleSave(); render(); renderSet();
    });
    return;
  }
  if(k==='dlgyes'){ confirmDlg(); return; }
  if(k==='dlgno'){ closeDlg(); return; }
});

/* ---------- selection ---------- */
var selTimer = null;
function queueSelBar(){
  if(selTimer) clearTimeout(selTimer);
  selTimer = setTimeout(updateSelBar, 140);
}
document.addEventListener('selectionchange', queueSelBar);
document.addEventListener('mouseup', queueSelBar);
document.addEventListener('touchend', queueSelBar);
document.addEventListener('scroll', function(){
  var bar = document.getElementById('selbar');
  if(bar && !bar.hidden) queueSelBar();
}, true);

/* ---------- boot ---------- */
function render(){ renderHome(); renderBook(); renderDrill(); renderWeak(); renderRank(); renderAsk(); }
rebuildPools();
loadLocal();
registerGen();
render();
show('home');
initDb();
initSample();
})();
</script>
